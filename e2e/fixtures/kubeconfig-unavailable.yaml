# Browser E2E stack only. A syntactically valid kubeconfig with no credentials
# that points at a port nothing listens on, so the api's Kubernetes provider
# reports itself unavailable instead of the stack failing to start. The E2E
# stack exercises the Linux track only; see e2e/docker-compose.e2e.yml.
apiVersion: v1
kind: Config
clusters:
  - name: unavailable
    cluster:
      server: https://127.0.0.1:1
contexts:
  - name: unavailable
    context:
      cluster: unavailable
      user: nobody
current-context: unavailable
users:
  - name: nobody
    user: {}
