# JumpToTech Labs — local Kubernetes sandbox (kind)
#
# This is the *substrate* for lab sandboxes during local development.
# It is provisioned once on the host by `scripts/cluster-up.sh` (never from
# inside an application container, so we never have to mount the Docker
# socket into a web-facing process).
#
# Docs: https://kind.sigs.k8s.io/docs/user/configuration/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jumptotech-labs

nodes:
  # A single control-plane node is enough: every student session is a
  # namespace inside this one shared cluster, never a cluster of its own.
  - role: control-plane
    image: kindest/node:v1.34.0
    labels:
      jumptotech.io/role: control-plane
    # Every container the kubelet starts without a seccomp profile gets the
    # runtime's default filter instead of none. Kubernetes' own default is
    # Unconfined — unlike Docker's — so without this a student Pod could make
    # every syscall the kernel offers (unshare, keyctl, bpf, …). Pod Security
    # `baseline` refuses an explicit `Unconfined`; this covers the Pods that say
    # nothing, which is nearly all of them. Only takes effect on a newly created
    # cluster: `scripts/cluster-up.sh` warns when a reused cluster lacks it.
    # See docs/pod-security.md.
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        seccompDefault: true

networking:
  # Deterministic host port so the developer's kubeconfig is stable across
  # re-creations of the cluster.
  apiServerAddress: "127.0.0.1"
  apiServerPort: 16443
