# JumpToTech Labs — admission controls for student lab namespaces.
#
# Applied cluster-wide by scripts/cluster-up.sh. Targets namespaces labelled
# jumptotech.io/managed=true (every session namespace).
#
# These policies enforce the security boundary for untrusted student commands.
# The verifier grades labs; admission prevents privilege escalation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jumptotech-deny-clusterrole-bindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  # `matchConditions` is a field of ValidatingAdmissionPolicySpec, not of
  # `matchConstraints`. Nested one level deeper the API server rejects the whole
  # object with a strict-decoding error, which silently left both policies
  # uninstalled — see the regression test in test/admission-policy.test.ts.
  matchConditions:
    - name: lab-service-account
      expression: "request.userInfo.username.startsWith('system:serviceaccount:lab-')"
  validations:
    - expression: "object.roleRef.kind != 'ClusterRole'"
      message: "RoleBindings referencing ClusterRoles are not permitted in lab namespaces"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jumptotech-deny-clusterrole-bindings
spec:
  policyName: jumptotech-deny-clusterrole-bindings
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        jumptotech.io/managed: "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jumptotech-protect-managed-resources
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        # PATCH is not an admission operation. The API server normalises an
        # HTTP PATCH to UPDATE before admission runs, so UPDATE already covers
        # both — listing "PATCH" made the whole object invalid without ever
        # widening what it caught.
        operations: ["UPDATE", "DELETE"]
        resources: ["*"]
  # Same correction as above: a sibling of `matchConstraints`, not a child.
  matchConditions:
    - name: lab-service-account
      expression: "request.userInfo.username.startsWith('system:serviceaccount:lab-')"
  validations:
    - expression: |
        !has(oldObject.metadata.labels) ||
        !('jumptotech.io/managed' in oldObject.metadata.labels) ||
        oldObject.metadata.labels['jumptotech.io/managed'] != 'true'
      message: "Platform-managed resources cannot be modified or deleted by students"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jumptotech-protect-managed-resources
spec:
  policyName: jumptotech-protect-managed-resources
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        jumptotech.io/managed: "true"
