# JumpToTech Labs — admission controls for student lab namespaces.
#
# Applied cluster-wide by scripts/cluster-up.sh. Targets namespaces labelled
# jumptotech.io/managed=true (every session namespace).
#
# These policies enforce the security boundary for untrusted student commands.
# The verifier grades labs; admission prevents privilege escalation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jumptotech-deny-clusterrole-bindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  # `matchConditions` is a field of ValidatingAdmissionPolicySpec, not of
  # `matchConstraints`. Nested one level deeper the API server rejects the whole
  # object with a strict-decoding error, which silently left both policies
  # uninstalled — see the regression test in test/admission-policy.test.ts.
  matchConditions:
    - name: lab-service-account
      expression: "request.userInfo.username.startsWith('system:serviceaccount:lab-')"
  validations:
    - expression: "object.roleRef.kind != 'ClusterRole'"
      message: "RoleBindings referencing ClusterRoles are not permitted in lab namespaces"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jumptotech-deny-clusterrole-bindings
spec:
  policyName: jumptotech-deny-clusterrole-bindings
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        jumptotech.io/managed: "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jumptotech-protect-managed-resources
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        # PATCH is not an admission operation. The API server normalises an
        # HTTP PATCH to UPDATE before admission runs, so UPDATE already covers
        # both — listing "PATCH" made the whole object invalid without ever
        # widening what it caught.
        operations: ["UPDATE", "DELETE"]
        resources: ["*"]
  # Same correction as above: a sibling of `matchConstraints`, not a child.
  matchConditions:
    - name: lab-service-account
      expression: "request.userInfo.username.startsWith('system:serviceaccount:lab-')"
  validations:
    - expression: |
        !has(oldObject.metadata.labels) ||
        !('jumptotech.io/managed' in oldObject.metadata.labels) ||
        oldObject.metadata.labels['jumptotech.io/managed'] != 'true'
      message: "Platform-managed resources cannot be modified or deleted by students"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jumptotech-protect-managed-resources
spec:
  policyName: jumptotech-protect-managed-resources
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        jumptotech.io/managed: "true"
---
# BETA-P0-016. A managed namespace always carries a Pod Security Admission
# enforce label of `baseline` or `restricted`, and cannot lose it.
#
# The orchestrator stamps the labels (session/pod-security.ts). This policy is
# what makes a regression there fail closed: without it, a code path that
# created a namespace without the labels would produce a sandbox in which
# `privileged: true`, `hostPID` and `hostPath: /` are all admitted, and nothing
# would say so. It applies to every caller — student, platform, operator — so
# the platform's own credential cannot weaken a namespace either.
#
# Unlike the two policies above it is not scoped to lab service accounts, and
# its binding has no namespaceSelector: for a Namespace object that selector
# reads the *new* labels, so an update removing `jumptotech.io/managed` would
# stop matching at the moment it mattered. The CEL condition checks the old
# object as well.
#
# A namespace created before this policy existed can still be labelled: the
# validation reads the new object, and adding the labels makes it pass.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jumptotech-require-pod-security
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: managed-namespace
      expression: >-
        (has(object.metadata.labels) &&
          'jumptotech.io/managed' in object.metadata.labels &&
          object.metadata.labels['jumptotech.io/managed'] == 'true') ||
        (oldObject != null && has(oldObject.metadata.labels) &&
          'jumptotech.io/managed' in oldObject.metadata.labels &&
          oldObject.metadata.labels['jumptotech.io/managed'] == 'true')
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'jumptotech.io/managed' in object.metadata.labels &&
        object.metadata.labels['jumptotech.io/managed'] == 'true'
      message: "A platform-managed namespace cannot stop being managed"
    - expression: >-
        has(object.metadata.labels) &&
        'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
        object.metadata.labels['pod-security.kubernetes.io/enforce'] in ['baseline', 'restricted']
      message: "A platform-managed namespace must enforce Pod Security 'baseline' or 'restricted' (pod-security.kubernetes.io/enforce)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jumptotech-require-pod-security
spec:
  policyName: jumptotech-require-pod-security
  validationActions: [Deny]
