# Grafana datasource — PLATFORM-003.
#
# Provisioned as code so a fresh container comes up with working dashboards and
# nobody has to click through a setup wizard during an incident.

apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned: every dashboard JSON references this uid. Changing it silently
    # breaks all eight.
    uid: jtt-prometheus
    type: prometheus
    access: proxy
    # Loopback: Grafana runs inside Prometheus's network namespace (BETA-P0-018),
    # and in production Prometheus listens on nothing else. The IPv4 literal, not
    # `localhost`, which resolves to ::1 first — where nothing listens.
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      # Matches the scrape interval, so Grafana's automatic step never asks for
      # finer resolution than the data actually has.
      timeInterval: 15s
