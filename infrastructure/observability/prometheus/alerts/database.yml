groups:
  - name: database
    rules:
      - alert: DatabaseDown
        expr: jtt_db_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'the platform database is unreachable'
          description: >-
            Sessions, ownership, progress and browser sign-ins all live there.
            The catalogue keeps serving from memory; nothing else works.
          runbook_url: docs/runbooks/RB-02-database.md

      # Above zero while the database is still answering means the application
      # is starved of connections, not that the database is dead. Two different
      # incidents that otherwise present identically as "everything is slow".
      - alert: DatabasePoolSaturated
        expr: jtt_db_pool_connections{state="waiting"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'requests are queuing for a database connection'
          runbook_url: docs/runbooks/RB-02-database.md

      # The API falls back to an in-memory store when DATABASE_URL is unset and
      # says so once, at startup, in a log nobody reads three weeks later —
      # after a restart has silently discarded a cohort's progress.
      - alert: ProgressStoreIsMemory
        expr: jtt_db_store_info{store="memory"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'learning history is IN MEMORY and will be lost on restart'
          runbook_url: docs/runbooks/RB-02-database.md

      # Recovered, or re-created? (disaster-recovery audit) A database back on
      # an empty volume is auto-migrated at startup and then reports the same
      # migration version as a restored one, so every other signal says
      # healthy. When its history begins is what differs: after the last good
      # backup means it was re-created after that backup. Quiet on a first
      # deployment (backed up afterwards), after a restore (the original ledger
      # comes back with it), and where no backup is recorded.
      - alert: DatabaseRecreatedSinceLastBackup
        expr: |
          max by (instance) (jtt_database_ledger_started_timestamp_seconds)
            > on(instance)
          max by (instance) (jtt_backup_last_success_timestamp_seconds{operation="backup"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'the database history begins after the last successful backup: it was re-created, not recovered'
          description: >-
            An empty database was initialised after the last good backup
            (a lost or replaced volume, or DATABASE_URL pointing at a new
            database). Students' history is in the backup, not here, and
            anything they do now diverges from it. Stop the api and
            restore (postgres-backup-restore.md §7.1) before anyone signs
            in. db-backup.sh refuses to back this database up (so
            retention cannot age the good archives out), and this stays
            firing, until it is restored or BACKUP_ACCEPT_NEW_DATABASE=true
            accepts it.
          runbook_url: docs/runbooks/RB-02-database.md
