# Platform-level alerts — PLATFORM-003.
#
# Severity policy:
#   critical  students are affected now, or a safety mechanism has stopped.
#             Pages. Must have a runbook whose step 3 restores service.
#   warning   degraded, or heading somewhere bad. Ticket, not a page.
#
# Every rule carries `runbook_url`. `alerts-have-runbooks.test.ts` fails the
# build if one points at a file that does not exist — an alert whose runbook is
# a dead link is worse than no runbook, because it costs an operator the two
# minutes they spend looking for it.

groups:
  - name: platform
    rules:
      - alert: ServiceDown
        expr: up{job=~"api|terminal|sandboxd"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} is not being scraped'
          description: >-
            Prometheus cannot reach {{ $labels.job }}. Either the process is
            gone, or its observability listener is. Students are affected if
            this is api or terminal.
          runbook_url: docs/runbooks/RB-01-service-down.md

      # A service that keeps coming back.
      #
      # `restart: unless-stopped` (docker-compose.production.yml) is what keeps
      # a crashed service from staying down on an unattended host. It also means
      # ServiceDown can miss the outage it exists for: `up == 0 for: 2m` needs
      # two *continuous* minutes, and a container that dies, restarts, serves a
      # scrape and dies again never gives them. The restart policy turns a clean
      # outage into a flap, so something has to count flaps.
      #
      # `changes()` rather than an average over `up`: it counts transitions, so
      # a service that is simply down contributes none and stays ServiceDown's
      # to report — and Alertmanager's first inhibit rule suppresses this one
      # underneath it anyway. Six changes in fifteen minutes is three full
      # down-up cycles: more than an operator restarting a service by hand,
      # and far fewer than a real loop, which Docker's one-minute backoff
      # ceiling puts at about fifteen.
      - alert: ServiceRestartLoop
        expr: changes(up{job=~"api|terminal|sandboxd"}[15m]) >= 6
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} keeps restarting'
          description: >-
            {{ $labels.job }} has gone away and come back at least three times in
            fifteen minutes. Its restart policy is putting it back rather than it
            staying up, so students see intermittent failures while `up` reads 1
            between scrapes. Read the exit reason before restarting it again.
          runbook_url: docs/runbooks/RB-01-service-down.md

      - alert: ServiceNotReady
        expr: jtt_readyz_ok == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }} reports itself not ready'
          description: >-
            The instance is alive but says it cannot serve. Read /readyz for the
            failing check — it names the dependency and nothing else.
          runbook_url: docs/runbooks/RB-01-service-down.md

      - alert: NoLabsLoaded
        expr: jtt_labs_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'the API loaded no lab definitions'
          description: >-
            LABS_DIR is wrong or the mount is missing. The catalogue is empty and
            nothing can be started.
          runbook_url: docs/runbooks/RB-07-no-labs-loaded.md

      - alert: LabDefinitionErrors
        expr: jtt_lab_load_errors > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value }} lab definitions were rejected at startup'
          description: >-
            Those labs are absent from the catalogue. The startup log names each
            one with the validation error.
          runbook_url: docs/runbooks/RB-07-no-labs-loaded.md

  # Alerts that reach nobody. Both fire while the destination is still a
  # DECISION REQUIRED (no webhook-url installed: every notification fails), and
  # say so; neither can itself be delivered then, so they are read where the
  # operator already looks — `alerts`, the dashboard, and the smoke's
  # observability.alerts line. The external heartbeat is what notices a dead
  # host or monitoring stack.
  - name: alert-delivery
    rules:
      - alert: AlertNotificationsFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Alertmanager could not deliver {{ $value }} {{ $labels.integration }} notification(s) in 15 minutes'
          description: >-
            Alerts are firing and reaching nobody. Read `prod logs --since 30m
            alertmanager | grep -i notify` for the reason; install or fix the
            destination (infrastructure/observability/alertmanager/secrets).
          runbook_url: docs/runbooks/private-beta-operations.md

      - alert: AlertmanagerUnreachable
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Prometheus cannot reach Alertmanager: no alert can be delivered'
          description: >-
            Alertmanager shares Prometheus's network namespace; restart the
            three monitoring services together (runbook §6).
          runbook_url: docs/runbooks/private-beta-operations.md
