groups:
  - name: sessions
    rules:
      # The headline student-facing alert.
      #
      # TWO conditions, deliberately, because either alone is wrong:
      #
      #   · a **count** floor — a ratio on its own is scale-blind. One failed
      #     start on a quiet evening is a 100% failure ratio, and paging for it
      #     is how an alert gets silenced before the day it matters.
      #   · a **ratio** — a count on its own would page during a busy class in
      #     which five starts failed out of four hundred.
      #
      # `for: 2m` against a 10-minute window. That ordering is the fix: the
      # previous version paired `for: 5m` with `rate(...[5m])`, which meant the
      # condition could never stay true long enough for a bounded burst. See the
      # recording rules, and `tests/lab-start-alerts.test.yml` for the six cases
      # this is pinned against.
      #
      # Three failures in ten minutes, for the private beta (BETA-P0-018). It
      # was five, sized for MAX_ACTIVE_SESSIONS=20; the beta runs 5 sessions
      # for about 5 students, so three turned away inside ten minutes is most
      # of the cohort. The ratio half still stops a few failures among many
      # starts from paging.
      - alert: LabStartsFailingHard
        expr: |
          jtt:lab_start_failures:increase10m >= 3
            and
          jtt:lab_start_failure:ratio10m > 0.30
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $value | printf "%.0f" }} lab starts failed in the last 10 minutes (>30% of attempts)'
          description: >-
            Students cannot reliably start labs. Scope it by lab_id, track and
            provider before touching anything — one lab, one track, one provider
            and everything are four different incidents.
          runbook_url: docs/runbooks/RB-03-lab-start-failures.md

      # The same shape one tier down: a lower floor and a lower ratio, and a
      # longer `for` so it describes a sustained problem rather than a blip.
      # Still well under the 10-minute window.
      - alert: LabStartFailureRateElevated
        expr: |
          jtt:lab_start_failures:increase10m >= 2
            and
          jtt:lab_start_failure:ratio10m > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | printf "%.0f" }} lab starts failed in the last 10 minutes (>10% of attempts)'
          runbook_url: docs/runbooks/RB-03-lab-start-failures.md

      # Capacity exhausted is measured by refusals, not by utilisation.
      # Utilisation at 100% with nobody being turned away is a full platform
      # working exactly as designed; a refusal is a student who was told no.
      #
      # BETA-P0-018 fixed two defects here, both found by promtool against the
      # beta's shape (one refusal, then none):
      #
      #   · `increase(...[5m])` with `for: 5m` is the pairing IE-3 removed from
      #     the start alerts. A single refusal keeps a 5-minute increase above
      #     zero for five minutes, so the condition never held long enough and
      #     the alert never fired — for a bounded burst it could not.
      #   · `jtt_session_capacity_rejections_total{track}` is not initialised,
      #     so a track's first refusal has no visible increment at all.
      #
      # The same event is `jtt_lab_start_outcome_total{outcome="capacity_reached"}`,
      # zero-initialised at startup; a 10-minute window with `for: 2m` leaves
      # eight minutes in which to fire. The per-track counter stays for diagnosis.
      - alert: CapacityExhausted
        expr: increase(jtt_lab_start_outcome_total{outcome="capacity_reached"}[10m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'students are being refused for lack of capacity'
          description: >-
            MAX_ACTIVE_SESSIONS has been reached and Start Lab is returning
            LAB_CAPACITY_REACHED. There is no queue past the cap.
          runbook_url: docs/runbooks/RB-04-capacity.md

      # Relative to `jtt_sessions_capacity_limit`, so it follows whatever
      # MAX_ACTIVE_SESSIONS is deployed. At the beta's 5, 4 sessions is 80% and
      # quiet; only 5 of 5 held for ten minutes crosses 85%: the next student
      # to press Start will be refused.
      - alert: CapacityNearExhausted
        expr: jtt:sessions_utilization:ratio > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'sandbox capacity is above 85% ({{ $value | humanizePercentage }})'
          runbook_url: docs/runbooks/RB-04-capacity.md

      # --- the stop-launches switch ----------------------------------------
      #
      # LAB_LAUNCHES_PAUSED refuses every Start Lab, on purpose, and only a
      # person lifts it. A refused start is deliberately not a failed start, so
      # nothing else ever fires on a pause: left on after the maintenance it
      # was set for, it is an outage with no alert and no explanation. Thirty
      # minutes is longer than a planned restart and short enough that a
      # forgotten pause is found the same class period.
      - alert: LabLaunchesPaused
        expr: max(jtt_lab_launches_paused) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'new lab launches have been paused for at least 30 minutes'
          description: >-
            LAB_LAUNCHES_PAUSED=true on the running api, so every Start Lab is
            refused. Running labs are unaffected. Lift it when the maintenance
            is over, or say in the incident channel why it stays.
          runbook_url: docs/runbooks/RB-21-launches-paused.md

      # --- lifecycle (BETA-P0-018) ------------------------------------------
      #
      # A reset that runs and does not finish leaves the session DEGRADED. One
      # is a student retrying; three in half an hour on a five-student beta is
      # a runtime that cannot rebuild sandboxes.
      - alert: LabResetsFailing
        expr: increase(jtt_lab_reset_outcome_total{outcome="failed"}[30m]) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | printf "%.0f" }} lab resets failed in the last 30 minutes'
          runbook_url: docs/runbooks/RB-17-session-lifecycle.md

      # Stuck states, from the age of the oldest session in each status. The
      # thresholds sit past the timers that should already have moved it:
      #   CREATING   provisioning waits at most 180s plus an image pull   → 10m
      #   RESETTING  the reaper recovers an abandoned reset at 10m        → 15m
      #   ENDING/EXPIRING  resumed after 5m, retried every 60s sweep      → 20m
      #   DEGRADED   idle expiry (20m) reclaims one nobody resets          → 40m
      - alert: SessionStuckProvisioning
        expr: jtt_sessions_oldest_status_age_seconds{status="CREATING"} > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'a session has been CREATING for {{ $value | humanizeDuration }}'
          runbook_url: docs/runbooks/RB-17-session-lifecycle.md

      - alert: SessionResetStuck
        expr: jtt_sessions_oldest_status_age_seconds{status="RESETTING"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'a session has been RESETTING for {{ $value | humanizeDuration }}; recovery should have moved it at 10 minutes'
          runbook_url: docs/runbooks/RB-17-session-lifecycle.md

      - alert: SessionTeardownStuck
        expr: max without(status) (jtt_sessions_oldest_status_age_seconds{status=~"ENDING|EXPIRING"}) > 1200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'a session teardown has been in flight for {{ $value | humanizeDuration }}; its slot is still held'
          runbook_url: docs/runbooks/RB-17-session-lifecycle.md

      - alert: SessionDegradedNotReclaimed
        expr: jtt_sessions_oldest_status_age_seconds{status="DEGRADED"} > 2400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'a DEGRADED session has held a slot for {{ $value | humanizeDuration }}'
          runbook_url: docs/runbooks/RB-17-session-lifecycle.md

      - alert: ProvisioningSlow
        expr: jtt:lab_provision_duration:p95_15m > 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'p95 provisioning for {{ $labels.provider }} is above 60s'
          description: >-
            Read the provisioning *step* breakdown before anything else — it
            names the subsystem, which p95 alone never does.
          runbook_url: docs/runbooks/RB-10-provisioning-slow.md
