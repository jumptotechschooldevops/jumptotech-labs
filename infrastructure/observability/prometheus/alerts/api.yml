groups:
  - name: api
    rules:
      - alert: ApiErrorRateHigh
        expr: jtt:http_error:ratio10m{service="api"} > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'more than 2% of API requests are 5xx'
          runbook_url: docs/runbooks/RB-11-api-errors-and-latency.md

      - alert: ApiLatencyHigh
        expr: jtt:http_duration:p95_10m{service="api"} > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'API p95 latency is above 1s'
          description: >-
            Start Lab, End Lab, Check Solution and Reset are excluded from this
            expression — each is bounded by the lab runtime, not the API
            (provisioning, teardown, reading live state, rebuilding a sandbox)
            and has its own alerts (ProvisioningSlow; the reaper alerts;
            VerificationSlow and VerificationErrorRate; LabResetsFailing and
            SessionResetStuck). What is left is the interactive API.
          runbook_url: docs/runbooks/RB-11-api-errors-and-latency.md

      # BETA-P0-019. Check Solution left ApiLatencyHigh because it is bounded by
      # the sandbox, not the API; this keeps its latency watched on its own
      # scale. Measured with five concurrent students: p95 2.2s, max 4s. Above
      # 10s for most of ten minutes is a student pressing Check and waiting on a
      # runtime that has stopped answering promptly — one provider at a time.
      - alert: VerificationSlow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, provider) (rate(jtt_verification_duration_seconds_bucket[10m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Check Solution p95 is above 10s'
          runbook_url: docs/runbooks/RB-13-verification.md

      - alert: EventLoopLagHigh
        expr: jtt_nodejs_eventloop_lag_p99_seconds > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }} event loop p99 lag is above 200ms'
          description: >-
            The process is CPU-bound or blocked. Everything it serves is slow,
            including its own health endpoints.
          runbook_url: docs/runbooks/RB-11-api-errors-and-latency.md

      - alert: VerificationErrorRate
        expr: jtt:verification_error:ratio10m > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'more than 5% of Check Solution requests cannot read the environment'
          description: >-
            result="error" only — a student who has not solved the lab yet is
            result="fail" and is not counted here.
          runbook_url: docs/runbooks/RB-13-verification.md
