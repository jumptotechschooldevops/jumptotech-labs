# Recording rules — PLATFORM-003.
#
# Ratios and rates that more than one dashboard panel and more than one alert
# need. Computing them once here means a panel and the alert that fires beside
# it cannot disagree about what "the failure rate" means — which is exactly the
# discrepancy that makes an operator distrust a dashboard mid-incident.
#
# Naming follows the Prometheus convention `level:metric:operation`.
#
# Every ratio divides by `clamp_min(..., 0.001)`. A ratio with a zero
# denominator is NaN, an alert on NaN never fires, and "no requests at all"
# would therefore look identical to "everything is fine" — which is the worst
# possible failure mode for a platform-health alert.

groups:
  - name: jtt-sessions
    interval: 15s
    rules:
      - record: jtt:lab_start:rate5m
        expr: sum(rate(jtt_lab_start_outcome_total[5m]))

      - record: jtt:lab_start_failed:rate5m
        expr: sum(rate(jtt_lab_start_outcome_total{outcome!="success"}[5m]))

      # --- the alerting path -------------------------------------------------
      #
      # COUNTS over 10 minutes, not rates over 5. This is the fix for the defect
      # incident exercise 3 found, and the reasoning is worth keeping because the
      # obvious expression is the broken one.
      #
      # `rate(X[5m])` holds a *bounded burst* as non-zero for only ~5 minutes
      # after it ends. The alert then asked for `for: 5m` — five minutes of
      # continuously true condition. The available truth is
      # `window + burst_duration`, so the whole firing margin is the burst's own
      # duration: a one-minute burst left a ~45-second firing window ten minutes
      # after the incident began, and IE-3's ten-second burst left none at all.
      # `promtool test rules` puts the old expression's only firing evaluation at
      # exactly t=10m30s and nowhere else.
      #
      # A count does not have that property. Eight failures inside a 10-minute
      # window read as eight for the whole window, so `for: 2m` has eight
      # minutes of opportunity rather than zero.
      #
      # `or vector(0)` covers the series being absent entirely — the API down,
      # or a scrape gap. Without it the expression goes empty, the alert
      # silently stops existing, and "no data" is indistinguishable from
      # "healthy" at exactly the moment that distinction matters.
      #
      # `student_limit_reached` is not a failure (BETA-P0-009). It is one student
      # already holding their MAX_ACTIVE_SESSIONS_PER_STUDENT sessions, and that
      # student pressing Start ten times must not page anyone. It still counts
      # as an attempt below, so it dilutes the ratio rather than hiding.
      #
      # `capacity_reached` is not a failure either: it is the platform full by
      # design, and CapacityExhausted (RB-04) pages on the first one. Counted
      # here it also fired LabStartsFailingHard — a second critical page, sending
      # the operator to RB-03's images, disks and providers — as soon as three
      # students pressed Start on a full five-seat platform.
      - record: jtt:lab_start_failures:increase10m
        expr: sum(increase(jtt_lab_start_outcome_total{outcome!~"success|student_limit_reached|capacity_reached"}[10m])) or vector(0)

      - record: jtt:lab_start_attempts:increase10m
        expr: sum(increase(jtt_lab_start_outcome_total[10m])) or vector(0)

      # Failures as a proportion of attempts, over the same window as the count
      # it is paired with — the two halves of the alert must describe the same
      # ten minutes or they can contradict each other.
      #
      # `clamp_min(…, 1)` only ever bites when there were no attempts at all, in
      # which case there were no failures either and the result is 0/1 = 0. It
      # is not masking anything: failures are a subset of attempts, so the
      # denominator cannot be smaller than the numerator.
      - record: jtt:lab_start_failure:ratio10m
        expr: |
          jtt:lab_start_failures:increase10m
            / clamp_min(jtt:lab_start_attempts:increase10m, 1)

      - record: jtt:lab_start_success:ratio5m
        expr: |
          sum(rate(jtt_lab_start_outcome_total{outcome="success"}[5m]))
            / clamp_min(sum(rate(jtt_lab_start_outcome_total[5m])), 0.001)

      # Capacity as a fraction. `jtt_sessions_active` is summed because it is
      # split by provider and status; the limit is a single global gauge.
      - record: jtt:sessions_utilization:ratio
        expr: sum(jtt_sessions_active) / clamp_min(max(jtt_sessions_capacity_limit), 1)

      # Free slots under MAX_ACTIVE_SESSIONS — BETA-P0-018. A count reads better
      # than a ratio at the beta's cap of 5, where each session is 20%.
      - record: jtt:sessions_headroom:count
        expr: max(jtt_sessions_capacity_limit) - (sum(jtt_sessions_active) or vector(0))

      - record: jtt:lab_provision_duration:p95_15m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, provider) (rate(jtt_lab_provision_duration_seconds_bucket[15m]))
          )

  - name: jtt-runtime
    interval: 15s
    rules:
      # THE LEAK NUMBER.
      #
      # Containers the runtime holds minus sessions the store knows about. Both
      # sides are read from their own source of truth at scrape time, which is
      # what makes the subtraction trustworthy — two maintained counters would
      # drift into a permanent false difference.
      #
      # `or vector(0)` on each side so the rule still evaluates when one service
      # is down; without it the whole expression goes empty and the leak alert
      # silently stops existing at the moment a leak is most likely.
      #
      # A NEGATIVE value is meaningful and is deliberately not clamped: it means
      # the store holds sessions whose container is already gone. Briefly that
      # is a teardown in flight — an ENDING session still counts as occupying
      # capacity until the delete is confirmed, which is correct. Persistently,
      # it is a stuck teardown, and RB-05 says what to do about it.
      #
      # Per session, and container-backed sessions only: an Ansible session
      # holds three containers and a Kubernetes session none, so containers
      # minus every session paged a healthy all-Ansible class (15 - 5) and let
      # five Kubernetes sessions hide five leaked containers.
      - record: jtt:sandbox_leak:count
        expr: |
          (sum(jtt_sandboxd_container_sessions) or vector(0))
            - (sum(jtt_sessions_active{provider!="kubernetes"}) or vector(0))

      - record: jtt:reaper_seconds_since_success
        expr: time() - max(jtt_reaper_last_success_timestamp_seconds)

  - name: jtt-http
    interval: 15s
    rules:
      - record: jtt:http_error:ratio10m
        expr: |
          sum by (service) (rate(jtt_http_requests_total{status_class="5xx"}[10m]))
            / clamp_min(sum by (service) (rate(jtt_http_requests_total[10m])), 0.001)

      # Start Lab is excluded on purpose: it legitimately takes up to
      # DOCKER_SANDBOX_READY_TIMEOUT_SECONDS (180s) plus an image pull, and
      # including it would make the API latency alert fire on correct behaviour.
      # Provisioning has its own histogram and its own alert.
      #
      # End Lab is excluded for exactly the same reason, and was missed because
      # it is not a route of its own: `DELETE /api/sessions/:sessionId` shares a
      # route template with a sub-100ms `GET`, so excluding by `route` alone
      # would have taken the GET with it. Ending a session deletes a namespace
      # or a container synchronously and measured p95 = 9.5s here, against a
      # 1s threshold — so `ApiLatencyHigh` sat firing while nothing was wrong,
      # and every student pressing End Lab kept it there. An alert that is
      # always on cannot report that the API has actually become slow.
      #
      # Nothing loses coverage: teardown failures are what matter, and they have
      # their own alerts (ReaperStalled, reaper delete failures, orphans found).
      # The `unless` removes only that one method on that one route; the GET
      # stays in the SLO.
      #
      # Check Solution and Reset are excluded for the same reason — BETA-P0-019.
      # A check reads live state inside the sandbox (an `ansible -m ping` to two
      # nodes, Kubernetes reads, execs through sandboxd) and a container reset
      # rebuilds the sandbox. Measured with five concurrent students on the real
      # stack: check p50 1.05s, p95 2.2s; reset p95 1.6s. Almost every check
      # lands above the 1s bucket, so once checks are more than ~5% of requests
      # the p95 is theirs — five students each pressing Check every three minutes
      # against the 15s session poll is enough, and `ApiLatencyHigh` sat firing
      # through the whole five-student run. Each keeps its own coverage:
      # `VerificationSlow` / `VerificationErrorRate` for checks, `LabResetsFailing`
      # / `SessionResetStuck` for resets. Both are distinct route templates, so
      # nothing else on `/api/sessions/:sessionId` leaves the SLO.
      - record: jtt:http_duration:p95_10m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service) (
              rate(jtt_http_request_duration_seconds_bucket{route!~"/api/labs/:id/start|/api/sessions/:sessionId/check|/api/sessions/:sessionId/reset"}[10m])
                unless
              rate(
                jtt_http_request_duration_seconds_bucket{
                  route="/api/sessions/:sessionId", method="DELETE"
                }[10m]
              )
            )
          )

  - name: jtt-verification
    interval: 15s
    rules:
      # `result="error"` only. `fail` is a student who has not solved it yet —
      # the most normal event in the product — and alerting on it would page
      # someone every time a class starts.
      - record: jtt:verification_error:ratio10m
        expr: |
          sum(rate(jtt_verification_total{result="error"}[10m]))
            / clamp_min(sum(rate(jtt_verification_total[10m])), 0.001)

  - name: jtt-auth
    interval: 15s
    rules:
      - record: jtt:auth_failure:ratio5m
        expr: |
          sum(rate(jtt_auth_attempts_total{outcome!="success"}[5m]))
            / clamp_min(sum(rate(jtt_auth_attempts_total[5m])), 0.001)

      # `superseded` is an attach cancelled because its session was closed, or
      # attached again from another tab, while it waited: nothing failed.
      - record: jtt:terminal_connection_failure:ratio10m
        expr: |
          sum(rate(jtt_terminal_connections_total{outcome!~"established|superseded"}[10m]))
            / clamp_min(sum(rate(jtt_terminal_connections_total[10m])), 0.001)

      # BETA-P0-018. Counts, not rates: `AuthFailureSpike` asks for more than one
      # failure a second, which five students can never produce.
      #
      # `AUTH_REQUIRED` is excluded — no credential at all is a signed-out or
      # expired browser, the most ordinary thing on the platform. What is left
      # is a credential presented and rejected.
      - record: jtt:auth_rejected:increase10m
        expr: sum(increase(jtt_auth_attempts_total{outcome!~"success|AUTH_REQUIRED"}[10m])) or vector(0)

      - record: jtt:auth_callback_failures:increase15m
        expr: sum(increase(jtt_auth_callback_total{outcome!="success"}[15m])) or vector(0)

  # --- deployment operations (BETA-P0-018) -------------------------------------
  #
  # Each keeps the source series' labels, so an alert on it still names the
  # instance, and the filesystem or backup operation it is about.
  - name: jtt-operations
    interval: 15s
    rules:
      - record: jtt:tls_certificate_expiry:seconds
        expr: jtt_tls_certificate_not_after_timestamp_seconds - time()

      - record: jtt:backup_age:seconds
        expr: time() - jtt_backup_last_success_timestamp_seconds

      - record: jtt:host_memory_available:ratio
        expr: jtt_host_memory_available_bytes / clamp_min(jtt_host_memory_total_bytes, 1)

      - record: jtt:host_filesystem_available:ratio
        expr: jtt_host_filesystem_available_bytes / clamp_min(jtt_host_filesystem_size_bytes, 1)

      - record: jtt:host_load5_per_cpu:ratio
        expr: jtt_host_load_average{window="5m"} / ignoring(window) clamp_min(jtt_host_cpus, 1)
