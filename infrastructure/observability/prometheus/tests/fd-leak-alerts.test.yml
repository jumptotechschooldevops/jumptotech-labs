# ---------------------------------------------------------------------------
# ProcessFileDescriptorsHigh: a leak pages, a class does not.
#
# The containers' `nofile` limit is 1,048,576, so the only useful threshold is
# an absolute one. The 2026-09-28 observability drill measured ~30 open file
# descriptors per service idle and 51 at the peak of a five-student class.
# ---------------------------------------------------------------------------

rule_files:
  - ../alerts/api.yml

evaluation_interval: 15s

tests:
  # ------------------------------------------------ 1. a class is not a leak
  - interval: 1m
    name: a busy class stays quiet
    input_series:
      - series: 'jtt_process_open_fds{job="terminal",instance="terminal:9401",service="terminal"}'
        values: '30 45 60 120 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280 280'
    alert_rule_test:
      - eval_time: 29m
        alertname: ProcessFileDescriptorsHigh
        exp_alerts: []

  # ---------------------------------------------- 2. a growing leak pages
  - interval: 1m
    name: descriptors that keep climbing page after fifteen minutes above 1000
    input_series:
      - series: 'jtt_process_open_fds{job="sandboxd",instance="sandboxd:9402",service="sandboxd"}'
        values: '30+100x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ProcessFileDescriptorsHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: ProcessFileDescriptorsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: sandboxd
              instance: sandboxd:9402
              service: sandboxd
            exp_annotations:
              summary: 'sandboxd holds 3030 open file descriptors'
              description: >-
                Far above what the session cap can explain, so something is not
                being closed: terminal sockets, broker shells, docker exec
                streams or database connections. It grows until the process
                fails to accept connections. Compare with
                jtt_terminal_connections_open and jtt_sandboxd_shells_open before
                restarting anything.
              runbook_url: docs/runbooks/RB-19-host-pressure.md
