# JumpToTech Labs — the development listener (plain HTTP on 3000).
#
# Published on 127.0.0.1 only by docker-compose.yml. A deployment replaces this
# file with web-tls.conf (docker-compose.production.yml): HTTPS on 443, and a
# redirect on 80. BETA-P0-012.
#
# Students reach only this service. `/api/*` and `/auth/*` are forwarded to the
# API container; `/terminal` is upgraded to the terminal WebSocket service.
# Everything else is the static Vite bundle.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every route lives in locations.conf, shared with the production TLS
    # listener (web-tls.conf) so the two cannot drift apart.
    include /etc/nginx/jumptotech/locations.conf;
}
