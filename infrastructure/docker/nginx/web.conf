# JumpToTech Labs — single public entrypoint (Cloudflare Tunnel / HTTPS front door).
#
# Students reach only this service. `/api/*` and `/auth/*` are forwarded to the
# API container; `/terminal` is upgraded to the terminal WebSocket service.
# Everything else is the static Vite bundle.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API — same paths the browser already uses.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Browser sign-in (PLATFORM-010).
    #
    # Must be same-origin with the app, and not a client-side route: the
    # session cookie is host-only and `SameSite=Lax`, so it is only sent back to
    # this origin — and `/auth/callback` is a real navigation the SPA fallback
    # below would otherwise swallow into index.html.
    location /auth/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Browser terminal WebSocket (xterm.js → terminal service).
    location /terminal {
        proxy_pass http://terminal:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback — client-side routes stay on the catalog shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
