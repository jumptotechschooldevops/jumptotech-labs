# JumpToTech Labs — the production TLS edge (BETA-P0-012, BETA-P0-017).
#
# Mounted over /etc/nginx/conf.d/default.conf by docker-compose.production.yml,
# which publishes host 443 → 8443 and host 80 → 8080 and nothing else. The
# listeners are unprivileged container ports; the host ports are the contract
# (infrastructure/secret-distribution.json → publishedPorts.production).
#
# The certificate and key are files in infrastructure/docker/nginx/tls/, mounted
# read-only into this container and no other. They are never baked into the
# image and never committed.
#
# Fail closed: before nginx starts, jtt-tls-preflight (tls-preflight.sh) checks
# PUBLIC_ORIGIN, the certificate, its chain, its dates, its host name and the
# key, and only then writes runtime/public-host.conf. Both servers below include
# that file, so without a passing gate this configuration does not load at all:
# there is no plaintext fallback, and no certificate is served for another host.
#
# Issuance, renewal, reload and expiry checks: docs/runbooks/production-tls.md
# and docs/runtime-architecture.md §12.

server_tokens off;

# Access log without query strings or referrers. The stock `main` format logs
# `$request`, which is the path *with* its query, and `$http_referer`: the OIDC
# callback (`/auth/callback?code=…&state=…`) put a live authorization code in
# `docker logs web` on every sign-in, and from there in anything an operator
# copies out of them. `$uri` is the path alone. Every server below uses this.
log_format jtt_edge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';

# Modern TLS: 1.2 and 1.3 only. For 1.2, forward-secret AEAD suites only (the
# Mozilla "intermediate" list, less the DHE suites, which need a dhparam file).
# TLS 1.3 suites are OpenSSL's defaults, all of them AEAD.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:jtt_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Port 80 carries a redirect, and the ACME HTTP-01 challenge directory. No
# proxy_pass and no application files: nothing here can serve a session cookie
# or an API response in plaintext.
server {
    listen 8080 default_server;
    access_log /var/log/nginx/access.log jtt_edge;
    include /etc/nginx/jumptotech/runtime/public-host.conf;

    # Challenge tokens an ACME client writes into
    # infrastructure/docker/nginx/acme-webroot/.well-known/acme-challenge/.
    # Read-only here; an absent token is a 404, never a redirect or a file
    # from anywhere else.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # To the configured host, not the request's Host header, so the redirect
    # cannot be pointed somewhere else.
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# A TLS client that does not ask for the public host by name gets no
# certificate and no content: scanners by IP address, and other names pointed
# at this machine. A request whose Host header differs from the name it asked
# for in the handshake lands here too, and is refused.
server {
    listen 8443 ssl default_server;
    access_log /var/log/nginx/access.log jtt_edge;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 8443 ssl;
    access_log /var/log/nginx/access.log jtt_edge;
    http2 on;
    include /etc/nginx/jumptotech/runtime/public-host.conf;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # One year, this host only. `includeSubDomains` and preload are decisions
    # about a whole domain, which this file cannot make.
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/jumptotech/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/jumptotech/locations.conf;
}
