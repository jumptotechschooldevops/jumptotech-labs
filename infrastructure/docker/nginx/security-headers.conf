# JumpToTech Labs — response headers for every page and API answer the web
# tier serves. Included at *server* level by web.conf and web-tls.conf.
#
# nginx drops every inherited `add_header` in a block that declares one of its
# own, so no location in locations.conf may use `add_header` (the edge contract
# test pins that): one there would silently strip these and HSTS.
#
# Deliberately not a full Content-Security-Policy. This one only forbids what
# the app never does — being framed, loading plugins, rebasing relative URLs —
# and restricts nothing the SPA, xterm.js or the terminal WebSocket needs. A
# script/style/connect policy wants a real-browser run of the whole flow first
# (docs/development/security-redteam-2026-09-19.md, follow-ups).
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
