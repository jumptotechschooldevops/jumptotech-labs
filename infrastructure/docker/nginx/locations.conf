# JumpToTech Labs — every route the web tier serves, included by both web.conf
# (development, :3000) and web-tls.conf (production, :8443).
#
# `/api/*` and `/auth/*` go to the api, `/terminal` is upgraded to the terminal
# WebSocket, and everything else is the static bundle. There is deliberately no
# route to sandboxd (:4002) or to any metrics listener (:9400-9402), and nothing
# here names PostgreSQL.

# Upstream addresses are looked up per request, not once at start-up.
#
# A literal `proxy_pass http://api:4000;` is resolved when nginx loads its
# configuration and never again. Compose re-creates the api or terminal
# container on `up -d` after an image or environment change, and the new
# container can get a different address on the network; nginx would then answer
# 502 on every request until web itself was restarted. A proxy_pass that holds a
# variable is resolved through `resolver` at request time instead, and the answer
# is cached for `valid`. 127.0.0.11 is Docker's embedded DNS on a user-defined
# network, which answers only for containers on web's own networks — the same
# names the literal form trusted, looked up later.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
set $jtt_api http://api:4000;
set $jtt_terminal http://terminal:4001;
#
# `proxy_connect_timeout 5s` on each proxied route: a connection inside one
# Docker network opens in milliseconds, and nginx's 60 s default is how long a
# student would otherwise watch "Checking your session…" when the api is gone.

# REST API — same paths the browser already uses.
location /api/ {
    proxy_pass $jtt_api;
    proxy_connect_timeout 5s;
    # Start Lab and Reset answer only once the sandbox is fully provisioned:
    # Docker-in-Docker alone may wait 180 s for its daemon, and provisioning is
    # measured up to 300 s. nginx's 60 s default turned a slow but successful
    # start into a 504 page while the lab went on being built.
    proxy_read_timeout 330s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Browser sign-in (PLATFORM-010).
#
# Must be same-origin with the app, and not a client-side route: the
# session cookie is host-only and `SameSite=Lax`, so it is only sent back to
# this origin — and `/auth/callback` is a real navigation the SPA fallback
# below would otherwise swallow into index.html.
location /auth/ {
    proxy_pass $jtt_api;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Browser terminal WebSocket (xterm.js → terminal service).
location /terminal {
    proxy_pass $jtt_terminal;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# SPA fallback — client-side routes stay on the catalog shell.
location / {
    try_files $uri $uri/ /index.html;
}
