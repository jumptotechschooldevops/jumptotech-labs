# JumpToTech Labs — every route the web tier serves, included by both web.conf
# (development, :3000) and web-tls.conf (production, :8443).
#
# `/api/*` and `/auth/*` go to the api, `/terminal` is upgraded to the terminal
# WebSocket, and everything else is the static bundle. There is deliberately no
# route to sandboxd (:4002) or to any metrics listener (:9400-9402), and nothing
# here names PostgreSQL.

# Upstream addresses are looked up per request, not once at start-up.
#
# A literal `proxy_pass http://api:4000;` is resolved when nginx loads its
# configuration and never again. Compose re-creates the api or terminal
# container on `up -d` after an image or environment change, and the new
# container can get a different address on the network; nginx would then answer
# 502 on every request until web itself was restarted. A proxy_pass that holds a
# variable is resolved through `resolver` at request time instead, and the answer
# is cached for `valid`. 127.0.0.11 is Docker's embedded DNS on a user-defined
# network, which answers only for containers on web's own networks — the same
# names the literal form trusted, looked up later.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
set $jtt_api http://api:4000;
set $jtt_terminal http://terminal:4001;
#
# `proxy_connect_timeout 5s` on each proxied route: a connection inside one
# Docker network opens in milliseconds, and nginx's 60 s default is how long a
# student would otherwise watch "Checking your session…" when the api is gone.
#
# Each proxied route also refuses a raw request target outside its own prefix
# (`if ($request_uri !~ …) { return 400; }`, last in the block). nginx picks the
# location on the normalised path but a variable `proxy_pass` forwards the
# client's raw target, and the api does not resolve dot segments: so
# `/internal/../api/labs` matched `/api/` here and reached the api's
# service-to-service `/internal` router, which must be off the edge entirely.
# No browser sends a dot segment. The api refuses them too (INVALID_PATH).

# Text assets are served compressed.
#
# A cold load of the application is the shell (250 KB) plus, on the workspace,
# the terminal emulator chunk (329 KB) and 44 KB of CSS: 622 KB uncompressed
# against 167 KB gzipped, measured on the production build. That is the
# difference between about 62 MB and 17 MB of transfer when a class of a
# hundred opens the page at the start of a lesson, and it is paid again by
# every student whose cache is cold.
#
# `gzip_proxied` is deliberately left at its default (off), so this compresses
# only the files this server holds — never a response proxied from the api.
# Compressing a response that mixes a secret with caller-influenced text is how
# compression side channels are built; a static bundle contains neither.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
# nginx 1.30 serves .js as text/javascript; the older type is listed so this
# keeps working if the image's mime.types changes under it.
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

# REST API — same paths the browser already uses.
location /api/ {
    proxy_pass $jtt_api;
    proxy_connect_timeout 5s;
    # Start Lab and Reset answer only once the sandbox is fully provisioned:
    # Docker-in-Docker alone may wait 180 s for its daemon, and provisioning is
    # measured up to 300 s. nginx's 60 s default turned a slow but successful
    # start into a 504 page while the lab went on being built.
    proxy_read_timeout 330s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    if ($request_uri !~ "^/api/") { return 400; }
}

# Browser sign-in (PLATFORM-010).
#
# Must be same-origin with the app, and not a client-side route: the
# session cookie is host-only and `SameSite=Lax`, so it is only sent back to
# this origin — and `/auth/callback` is a real navigation the SPA fallback
# below would otherwise swallow into index.html.
location /auth/ {
    # The access format logs `$uri`, never the query string; nginx's error log
    # has no format and writes the whole request line. With the api down, every
    # `/auth/callback` put its authorization code and state into `docker logs
    # web` (measured, 2026-09-28 observability drill). Upstream failures here
    # are logged at `error`, so this location logs only `crit`: the 502 is still
    # in the access log, and the api's own alerts say why.
    error_log /var/log/nginx/error.log crit;
    proxy_pass $jtt_api;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    if ($request_uri !~ "^/auth/") { return 400; }
}

# Browser terminal WebSocket (xterm.js → terminal service).
location /terminal {
    proxy_pass $jtt_terminal;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    if ($request_uri !~ "^/terminal") { return 400; }
}

# SPA fallback — client-side routes stay on the catalog shell.
location / {
    try_files $uri $uri/ /index.html;
}
