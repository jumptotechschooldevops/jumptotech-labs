  # ---------------------------------------------------------------------------
  - id: ansible
    title: Configuration Management
    summary: >-
      Configuring many servers at once with Ansible — inventories, playbooks, variables,
      templates, handlers and roles — written so they are safe to run again.
    why: >-
      Configuring servers by hand does not scale and cannot be repeated reliably. Ansible
      turns server setup into reviewed, repeatable code, and idempotent automation is what
      makes running it again safe.
    objectives:
      - Describe servers in an inventory and reach them with Ansible
      - Write playbooks that use variables, loops, conditions and templates
      - Restart services only when their configuration changed
      - Package automation as a reusable role
      - Troubleshoot a broken Ansible project from its output
    prerequisites:
      - stage: linux
        kind: required
    skills:
      - ansible.inventory
      - ansible.ad-hoc
      - ansible.playbooks
      - ansible.variables
      - ansible.templates
      - ansible.handlers
      - ansible.roles
      - ansible.idempotency
      - ansible.troubleshooting
    labs:
      - lab: ANSIBLE-001
        skills: [ansible.inventory]
        why: Builds an inventory and proves Ansible can reach the servers in it.
      - lab: ANSIBLE-002
        skills: [ansible.ad-hoc]
        why: Changes several servers at once with ad-hoc commands, and shows why that is not a playbook.
      - lab: ANSIBLE-003
        skills: [ansible.playbooks]
        why: Writes and runs a first playbook.
      - lab: ANSIBLE-004
        skills: [ansible.variables]
        why: Moves hard-coded values into group and host variables.
      - lab: ANSIBLE-005
        skills: [ansible.variables]
        why: Uses loops and conditions instead of repeated tasks.
      - lab: ANSIBLE-006
        skills: [ansible.handlers, ansible.idempotency]
        why: Reloads a service only when its configuration changed, and proves a second run changes nothing.
      - lab: ANSIBLE-007
        skills: [ansible.templates]
        why: Renders a configuration file for each server from one Jinja2 template.
      - lab: ANSIBLE-008
        skills: [ansible.roles, ansible.idempotency]
        why: Refactors a playbook into a reusable role.
      - lab: ANSIBLE-009
        skills: [ansible.playbooks, ansible.templates, ansible.idempotency]
        why: Deploys a web tier to two servers from one idempotent playbook.
      - lab: ANSIBLE-010
        skills: [ansible.troubleshooting]
        why: Repairs a broken Ansible project using the tool's own error output.

  # ---------------------------------------------------------------------------
  - id: helm-gitops
    title: Helm & GitOps
    summary: >-
      Packaging Kubernetes applications as Helm charts, and deploying them from Git with
      Argo CD so the cluster always matches what the repository says.
    why: >-
      Teams rarely apply raw manifests in production. Helm makes applications reusable
      and configurable, and GitOps makes every deployment a reviewed Git change that can
      be audited and rolled back.
    objectives:
      - Install, configure and upgrade an application from a Helm chart
      - Explain how chart values and releases work
      - Describe the GitOps model and why Git is the source of truth
      - Keep a cluster in step with a repository using Argo CD
    prerequisites:
      - stage: kubernetes
        kind: required
      - stage: git
        kind: recommended
    skills:
      - helm.charts
      - helm.releases
      - gitops.principles
      - gitops.argocd
    coming_soon: >-
      JumpToTech Labs does not have Helm, Argo CD or GitOps labs yet.
    labs: []

  # ---------------------------------------------------------------------------
  - id: observability
    title: Observability & SRE
    summary: >-
      Knowing what a running system is doing — logs, metrics, alerts and service level
      objectives — and using that evidence to keep it reliable.
    why: >-
      You cannot fix what you cannot see. Site reliability work depends on collecting the
      right signals, alerting on what matters to users, and investigating incidents from
      evidence rather than memory.
    objectives:
      - Get application logs to where people and tools can read them
      - Explain what metrics, monitoring and alerting are for
      - Define service level indicators and objectives
      - Investigate an incident from its evidence
    prerequisites:
      - stage: kubernetes
        kind: recommended
    skills:
      - observability.logs
      - observability.metrics
      - observability.alerting
      - sre.slos
      - sre.incident-investigation
      - sre.reliability
    coming_soon: >-
      There are no labs yet for metrics, monitoring tools such as Prometheus and Grafana,
      alerting, or SLOs. Incident investigation and reliability are practised in earlier
      stages (AWS-006, K8S-008, K8S-015).
    labs:
      - lab: K8S-017
        skills: [observability.logs, kubernetes.pods]
        why: Makes a file-based audit log readable with kubectl logs using a sidecar — how logs reach collection tools on Kubernetes.

  # ---------------------------------------------------------------------------
  - id: devsecops
    title: DevSecOps & Production Readiness
    summary: >-
      Building security into everyday work — least privilege, secrets, network isolation,
      scanning, TLS and runtime controls — and checking a service is ready for production.
    why: >-
      Security is part of every change a DevOps engineer makes, not a final review. Most
      breaches start with too much access, a leaked secret or an unpatched dependency —
      all things this work prevents.
    objectives:
      - Grant exactly the access a person or program needs, and verify it by what it refuses
      - Keep secrets out of code, images and pipelines
      - Keep private systems unreachable from where they should not be reached
      - Explain scanning, TLS and runtime security controls
    prerequisites:
      - stage: linux
        kind: recommended
      - stage: kubernetes
        kind: recommended
    skills:
      - security.least-privilege
      - security.secrets
      - security.network-isolation
      - security.scanning
      - security.runtime
      - security.tls
      - operations.production-readiness
    coming_soon: >-
      There are no labs yet for vulnerability scanning, TLS and certificates, runtime
      security or production readiness reviews. Least privilege, secrets and network
      isolation are also practised in earlier stages (AWS-002, AWS-005, AWS-009, CICD-008,
      K8S-005, K8S-012).
    labs:
      - lab: LINUX-015
        skills: [security.least-privilege]
        why: Replaces a blanket sudo rule with one that grants exactly two commands, and checks it by what it denies.

