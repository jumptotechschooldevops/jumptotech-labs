  - id: production-engineer
    title: Production Engineering
    summary: >-
      Putting it all together — troubleshooting failures that cross systems, working
      production incidents, building complete projects, and preparing for interviews and
      a practical assessment.
    why: >-
      Real incidents do not stay inside one tool. Employers look for engineers who can
      follow a problem from the application to the cluster to the network to the cloud,
      and explain how they found it.
    objectives:
      - Diagnose failures that span several systems
      - Work a production incident from alert to review
      - Build and operate a complete project
      - Explain your work clearly in an interview
    prerequisites:
      - stage: observability
        kind: recommended
      - stage: devsecops
        kind: recommended
    skills:
      - production.integrated-troubleshooting
      - production.incident-response
      - production.projects
      - career.interview-preparation
      - assessment.practical
