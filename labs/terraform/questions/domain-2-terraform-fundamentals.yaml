certification: TERRAFORM-ASSOCIATE-004
description: Providers, provider versioning, the dependency lock file, multiple provider configurations, and what state is for.

questions:
  - id: TFQ-201
    objective: 2a
    type: single
    question: >
      Where does a configuration declare which providers it needs and which
      versions of them are acceptable?
    choices:
      - In a `required_providers` block inside the `terraform` block
      - In a `provider` block, using its `version` argument
      - In the `.terraform.lock.hcl` file, which the author edits by hand
      - In a `providers.tfvars` file read at init time
    correct_answer:
      - In a `required_providers` block inside the `terraform` block
    explanation: >
      `required_providers` is where a module states each provider's source
      address and version constraint. The `version` argument inside a `provider`
      block is deprecated for this purpose, the lock file is generated by
      Terraform rather than authored, and there is no `providers.tfvars`
      mechanism. Keeping the declaration in `required_providers` is what lets
      Terraform resolve versions across the root module and every module it
      calls.
    official_reference: https://developer.hashicorp.com/terraform/language/providers/requirements

  - id: TFQ-202
    objective: 2a
    type: multiple
    question: >
      A team has committed `.terraform.lock.hcl` alongside their configuration.
      Pick the 2 statements that are true about that file.
    choices:
      - It records the exact provider versions Terraform selected, so later runs install the same ones
      - It records checksums for the provider packages, so a tampered package is detected on install
      - It is regenerated from scratch on every `terraform plan`, so committing it has no effect
      - It stores the credentials Terraform used to authenticate to each provider
      - It replaces the need for a `required_providers` block
    correct_answer:
      - It records the exact provider versions Terraform selected, so later runs install the same ones
      - It records checksums for the provider packages, so a tampered package is detected on install
    explanation: >
      The dependency lock file pins the resolved version of each provider and
      records the hashes of the packages that were installed, so every later
      `terraform init` on that configuration gets byte-identical plugins. It is
      written by `terraform init`, not by `plan`, and it is meant to be
      committed. It holds no credentials, and it does not replace
      `required_providers` — the constraint says what is acceptable, the lock
      says what was chosen.
    official_reference: https://developer.hashicorp.com/terraform/language/files/dependency-lock

  - id: TFQ-203
    objective: 2a
    type: single
    question: >
      A configuration constrains a provider with `version = "~> 3.6.0"` and the
      lock file records 3.6.1. Provider version 3.6.3 has since been published.
      Which command makes Terraform select the newer version and update the lock
      file?
    choices:
      - terraform init -upgrade
      - terraform init
      - terraform apply -refresh-only
      - terraform providers lock -reset
    correct_answer:
      - terraform init -upgrade
    explanation: >
      A plain `terraform init` honours the lock file and reinstalls the version
      already recorded there, which is what makes runs reproducible. `-upgrade`
      tells Terraform to reconsider the constraint and select the newest
      acceptable version, then rewrite the lock file. `~> 3.6.0` allows the
      patch to move to 3.6.3, so the upgrade succeeds. `apply -refresh-only`
      concerns state, not providers.
    official_reference: https://developer.hashicorp.com/terraform/cli/commands/init

  - id: TFQ-204
    objective: 2b
    type: single
    question: >
      What is a Terraform provider?
    choices:
      - A plugin that implements resource and data source types for a specific platform's API
      - A cloud account that Terraform authenticates against before it can plan
      - A module published to the Terraform Registry that packages reusable resources
      - A backend that stores Terraform state remotely for a team
    correct_answer:
      - A plugin that implements resource and data source types for a specific platform's API
    explanation: >
      Terraform Core handles the language, the graph and the state; providers
      are separate plugins that translate resource blocks into calls against a
      platform's API. Everything a configuration can manage comes from some
      provider. An account is a credential, a module is reusable configuration,
      and a backend stores state — none of them is a provider.
    official_reference: https://developer.hashicorp.com/terraform/plugin/how-terraform-works

  - id: TFQ-205
    objective: 2b
    type: single
    question: >
      Where does Terraform install provider plugins for a working directory?
    choices:
      - Into the `.terraform` directory in that working directory, during `terraform init`
      - Into the system PATH, during installation of the Terraform CLI
      - Into the state file, so that they travel with the state
      - Into the module cache, only when a module that needs them is called
    correct_answer:
      - Into the `.terraform` directory in that working directory, during `terraform init`
    explanation: >
      `terraform init` resolves the providers a configuration requires and
      installs them under the working directory's `.terraform` directory, then
      records what it chose in the dependency lock file. That is why `init` must
      run before `plan` or `apply`, and why a fresh clone of a repository needs
      an `init` before anything else works. Providers are never stored in state.
    official_reference: https://developer.hashicorp.com/terraform/cli/commands/init

  - id: TFQ-206
    objective: 2b
    type: true_false
    question: >
      A provider block is required in the configuration before Terraform can use
      that provider's resources.
    correct_answer:
      - 'False'
    explanation: >
      A `provider` block supplies configuration such as a region or an endpoint.
      When a provider needs no configuration, or every argument has a usable
      default or comes from an environment variable, Terraform will use an empty
      default configuration for it without a block being written. What a
      configuration does need is the provider's entry in `required_providers`,
      so that Terraform knows which plugin to install.
    official_reference: https://developer.hashicorp.com/terraform/language/providers/configuration

  - id: TFQ-207
    objective: 2c
    type: single
    question: >
      A configuration must create resources in two different regions of the same
      cloud provider. What is the standard way to express this?
    choices:
      - Declare a second `provider` block with an `alias`, then set `provider = <name>.<alias>` on the resources that belong to it
      - Declare the region as a variable and run `terraform apply` once per region
      - Declare two entries for the provider in `required_providers`, one per region
      - Split the configuration into two working directories, because one directory can hold only one provider configuration
    correct_answer:
      - Declare a second `provider` block with an `alias`, then set `provider = <name>.<alias>` on the resources that belong to it
    explanation: >
      Aliases exist precisely for multiple configurations of the same provider.
      The unaliased block is the default configuration; each aliased block gets a
      name, and a resource opts into one with the `provider` meta-argument.
      `required_providers` names each provider once regardless of how many
      configurations exist, and there is no need to split directories or make
      repeated runs.
    official_reference: https://developer.hashicorp.com/terraform/language/providers/configuration

  - id: TFQ-208
    objective: 2c
    type: single
    question: >
      A resource block sets `provider = local.reports`. What does that
      expression refer to?
    choices:
      - The `local` provider configuration whose alias is `reports`
      - A local value named `reports`
      - The `reports` attribute of a resource named `local`
      - A module named `local` and its output named `reports`
    correct_answer:
      - The `local` provider configuration whose alias is `reports`
    explanation: >
      The `provider` meta-argument takes a provider configuration reference,
      written as the provider's local name followed by the alias. It is not an
      ordinary expression and is not evaluated like one, which is why it looks
      similar to a local value reference but means something entirely different.
      A local value would be written `local.reports` in an argument's value, not
      in the `provider` meta-argument.
    official_reference: https://developer.hashicorp.com/terraform/language/meta-arguments/resource-provider

  - id: TFQ-209
    objective: 2c
    type: multiple
    question: >
      A configuration uses three providers. Pick the 2 statements that are true
      about how Terraform handles this.
    choices:
      - All three providers are declared in a single `required_providers` block
      - "`terraform init` installs all three before a plan can be generated"
      - Terraform runs each provider in a separate working directory
      - Only one provider may be used per resource block, and the rest must go in modules
      - Terraform merges the three providers' resource types into one namespace, so type names must be globally unique
    correct_answer:
      - All three providers are declared in a single `required_providers` block
      - "`terraform init` installs all three before a plan can be generated"
    explanation: >
      One `required_providers` block lists every provider a module needs, and
      `init` resolves and installs all of them. Each resource belongs to exactly
      one provider — determined by its type name — but a single configuration
      may freely mix resources from every provider it requires. Providers are not
      isolated into separate directories, and resource type names are namespaced
      by their provider's local name rather than being globally unique.
    official_reference: https://developer.hashicorp.com/terraform/language/providers/requirements

  - id: TFQ-210
    objective: 2d
    type: multiple
    question: >
      Pick the 2 statements that describe why Terraform keeps a state file.
    choices:
      - It maps resources in the configuration to the real objects Terraform created
      - It records dependency and metadata information used to plan the next change
      - It stores the provider plugins so they do not need reinstalling
      - It holds the configuration itself, so the `.tf` files can be deleted after apply
      - It caches the credentials used for the last apply so the next run needs none
    correct_answer:
      - It maps resources in the configuration to the real objects Terraform created
      - It records dependency and metadata information used to plan the next change
    explanation: >
      State is Terraform's record of the binding between a configuration address
      such as `local_file.report` and the real object behind it, together with
      the attributes and dependency information a plan needs. It is not a copy of
      the configuration, not a plugin cache, and not a credential store — and a
      state file may well contain sensitive attribute values, which is why it
      must be protected rather than treated as a cache.
    official_reference: https://developer.hashicorp.com/terraform/language/state/purpose

  - id: TFQ-211
    objective: 2d
    type: single
    question: >
      A resource exists in Terraform state but has been deleted from the
      configuration. What does the next `terraform apply` propose?
    choices:
      - Destroying that resource, because state records it as managed but the configuration no longer asks for it
      - Leaving it untouched, because Terraform only acts on what is in the configuration
      - Removing it from state but leaving the real object in place
      - Failing with an error until the resource is re-added to the configuration
    correct_answer:
      - Destroying that resource, because state records it as managed but the configuration no longer asks for it
    explanation: >
      Terraform plans by comparing configuration with state. A resource in state
      and not in configuration means "this exists and you no longer want it", so
      the plan proposes a destroy. Dropping it from state without destroying it
      is a different, deliberate operation — `terraform state rm`, or a `removed`
      block — and is how you hand a resource over to something else rather than
      delete it.
    official_reference: https://developer.hashicorp.com/terraform/language/state
