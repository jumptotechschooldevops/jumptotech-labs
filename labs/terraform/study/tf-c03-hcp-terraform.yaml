# JumpToTech Labs — CONCEPTUAL study unit
#
# TF-C03 covers all four objectives of domain 8. HCP Terraform is a hosted
# platform: using it needs an account, a network and a browser login. This
# repository's Terraform sandbox has none of those, on purpose.
