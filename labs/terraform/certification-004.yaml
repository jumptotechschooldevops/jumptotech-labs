            url: https://developer.hashicorp.com/terraform/tutorials/configuration-language/provider-versioning
      - id: 2b
        title: Describe how Terraform uses providers
        practice: hands-on
        references:
          - title: Providers
            url: https://developer.hashicorp.com/terraform/language/providers
          - title: How Terraform works with plugins
            url: https://developer.hashicorp.com/terraform/plugin/how-terraform-works
      - id: 2c
