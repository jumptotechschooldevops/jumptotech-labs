# ---------------------------------------------------------------------------
# JumpToTech Labs — certification objective catalog
#
# HashiCorp Certified: Terraform Associate (004).
#
# This file is the machine-readable copy of the *official* exam content list.
# It is data, not curriculum: the domain and objective ids and titles are
# HashiCorp's, the reference URLs are HashiCorp's, and nothing in here describes
# a JumpToTech lab. The mapping in the other direction — which lab or question
# covers which objective — lives in the lab and question files themselves, so
# that adding a lab cannot silently claim coverage this file did not define.
#
# The coverage gate (`npm run certification:terraform`) reads this file, walks
# every Terraform lab, study unit and question, and fails when an objective has
# neither hands-on practice nor assessment coverage.
#
# Reviewed against the official content list on 2026-08-17. Re-review whenever
# HashiCorp publishes a new exam version; see docs/certifications/.
# ---------------------------------------------------------------------------
id: TERRAFORM-ASSOCIATE-004
name: 'HashiCorp Certified: Terraform Associate (004)'
short_name: Terraform Associate (004)
vendor: HashiCorp
track: terraform
exam_version: '004'

# The Terraform version the certification states it tests. Compared against the
# version the sandbox image actually ships; see docs/certifications/.
product: Terraform
product_version: '1.12'

reviewed_on: '2026-08-17'

# Deliberately no pass-rate claim and no question count: HashiCorp publishes the
# format, and repeating a number here that could drift would be a claim we
# cannot keep current.
notes: >
  The 004 exam adds four topics relative to 003: explicit resource dependencies
  and create_before_destroy (4f), custom conditions (4g), ephemeral values and
  write-only arguments (4h), and organising HCP Terraform workspaces and
  projects (8c). It tests Terraform 1.12 and includes HCP Terraform content.
  Completing this track does not guarantee a pass; it maps our curriculum onto
  every published objective.

sources:
  - title: Exam Content List — Terraform Associate 004
    url: https://developer.hashicorp.com/terraform/tutorials/certification-004/associate-review-004
  - title: Learning Path — Terraform Associate 004
    url: https://developer.hashicorp.com/terraform/tutorials/certification-004/associate-study-004
  - title: Sample Questions — Terraform Associate 004
    url: https://developer.hashicorp.com/terraform/tutorials/certification-004/associate-questions-004
  - title: Associate Prep (004)
    url: https://developer.hashicorp.com/terraform/tutorials/certification-004
  - title: HashiCorp Certifications — Infrastructure Automation
    url: https://developer.hashicorp.com/certifications/infrastructure-automation

# `practice` is JumpToTech's delivery decision for the objective, not HashiCorp's:
#
#   hands-on    the objective can be practised for real in an offline, no-cloud
#               sandbox, so the curriculum must contain a lab that verifies it
#   conceptual  it cannot be — remote services, paid platforms, or knowledge
#               that has no artefact to inspect — so the curriculum must teach
#               it in a study unit and assess it with questions
#
# Every objective, whichever it is, must also carry assessment coverage. The
# coverage gate enforces both halves.
domains:
  - id: '1'
    title: Infrastructure as Code (IaC) with Terraform
    objectives:
      - id: 1a
        title: Explain what IaC is
        practice: conceptual
        references:
          - title: What is Terraform?
            url: https://developer.hashicorp.com/terraform/intro
          - title: Infrastructure as code
            url: https://developer.hashicorp.com/terraform/tutorials/aws-get-started/infrastructure-as-code
      - id: 1b
        title: Describe the advantages of IaC patterns
        practice: conceptual
        references:
          - title: Why Terraform?
            url: https://developer.hashicorp.com/terraform/intro#why-terraform
          - title: Infrastructure as code
            url: https://developer.hashicorp.com/terraform/tutorials/aws-get-started/infrastructure-as-code
      - id: 1c
        title: Explain how Terraform manages multi-cloud, hybrid cloud, and service-agnostic workflows
        practice: conceptual
        references:
          - title: Terraform use cases — multi-cloud deployment
            url: https://developer.hashicorp.com/terraform/intro/use-cases
          - title: How Terraform works
            url: https://developer.hashicorp.com/terraform/plugin/how-terraform-works

