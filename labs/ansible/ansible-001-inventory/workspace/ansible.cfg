# ---------------------------------------------------------------------------
# Ansible configuration for this lab.
#
# `inventory` is the setting that lets you type `ansible all -m ping` instead
# of `ansible -i inventory.ini all -m ping` on every single command.
#
# The file it points at does not exist yet. That is your task.
#
# `remote_user` is already set for you: the managed nodes attached to your
# session accept SSH as root, and your control node holds the session key.
# ---------------------------------------------------------------------------
[defaults]
inventory = inventory.ini
remote_user = root
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
# `remote_port` is a platform detail, not a lesson. The managed nodes attached
# to your session run sshd on 2222 rather than 22, so that the containers they
# live in need no capability to bind a privileged port. Setting it here means
# every `ansible` and `ansible-playbook` command finds them without you having
# to repeat it — an inventory may still override it per host with
# `ansible_port` if a lab asks you to.
remote_port = 2222
