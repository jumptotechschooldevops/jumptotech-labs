# ---------------------------------------------------------------------------
# Ansible configuration for this lab.
#
# `inventory` points at the file next to this one, so every `ansible` command
# you run already knows about node1 and node2 without a -i flag.
# ---------------------------------------------------------------------------
[defaults]
inventory = inventory.ini
remote_user = root
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
