---
# The ledger service playbook — everything in one file.
#
# It works. It is also the fourth playbook this team has written that contains
# these same four tasks, and when the log directory moved last month it had to
# be fixed in all four. That is the problem a role solves.
- name: Configure the ledger service
  hosts: web
  tasks:
    - name: Ensure the configuration directory exists
      ansible.builtin.file:
        path: /etc/jumptotech
        state: directory
        mode: "0755"

    - name: Ensure the log directory exists
      ansible.builtin.file:
        path: /var/log/jumptotech
        state: directory
        mode: "0755"

    - name: Deploy the application configuration
      ansible.builtin.template:
        src: app.conf.j2
        dest: /etc/jumptotech/app.conf
        mode: "0644"
      notify: reload ledger

  handlers:
    - name: reload ledger
      ansible.builtin.copy:
        dest: /var/log/jumptotech/reload.log
        mode: "0644"
        content: |
          reloaded ledger
