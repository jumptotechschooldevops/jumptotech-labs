id: ANSIBLE-010
slug: ansible-010-troubleshooting
title: Repair a Broken Ansible Project
track: ansible
topic: troubleshooting
difficulty: advanced
level: challenge
duration_minutes: 50
order: 10

environment:
  provider: ansible
  isolation: container

prerequisites:
  - ANSIBLE-009

story: >
  A colleague left the bank last month. Their handover note said "the ledger
  playbook works, just run it". It does not run, it has not run since the
  handover, and the ledger configuration on both web servers is now whatever it
  happened to be in March.

  Nobody wrote down what is broken. There is more than one thing wrong, and
  fixing the first one only reveals the next. That is what real handovers look
  like.

objectives:
  - Diagnose an Ansible failure from the tool's own output rather than by guessing
  - Use ansible-inventory, --syntax-check, and -v as a deliberate sequence
  - Recognise the difference between a parse error, a connection error, a template error, and a silent no-op
  - Restore a project to a state that converges

task:
  summary: Find and fix everything wrong with the inherited project until it deploys the ledger configuration correctly to both nodes.
  description: >
    The project in your workspace is broken in several independent ways. Some
    failures stop the run immediately; at least one causes no error at all and
    simply does not do what it looks like it does.

    Work outwards from the tools rather than reading the files hopefully:

    `ansible-inventory --list` answers "does Ansible understand my inventory,
    and which hosts and groups does it think exist?" It also parses the
    variables files, so it fails when one of those is malformed.

    `ansible all -m ping` answers "can Ansible actually open a session on these
    machines?" A host that reports UNREACHABLE has a connection problem, which
    is a different kind of problem from a task that fails.

    `ansible-playbook --syntax-check site.yml` answers "is this a well-formed
    playbook?" It touches no server, so it is cheap to run after every edit.

    `ansible-playbook site.yml` and, when the message is not enough,
    `ansible-playbook -v site.yml` show what each task actually did and why it
    stopped.

    When you are finished, running the playbook must leave both managed nodes
    with:

    `/etc/jumptotech/app.conf` containing `app_name=ledger`, `app_port=9090`,
    `app_release=2.4.1`, and a `served_by=` line naming that node.

    `/var/log/jumptotech/reload.log` containing `reloaded ledger` — which only
    appears if the handler genuinely ran.

    And it must converge: a second run in a row must report no changes at all.
    The final check proves this properly. It clears the directories the playbook
    owns, runs the playbook once and expects it to change things, then runs it
    again and expects it to change nothing. A playbook that only works on a
    machine that is already half-configured will not pass it.

requirements:
  - type: ansible_inventory_valid
    label: Ansible can parse the inventory and its variables
  - type: ansible_connectivity
    pattern: all
    min_hosts: 2
    label: Both managed nodes are reachable
  - type: ansible_playbook_valid
    playbook: site.yml
    label: Ansible accepts the playbook
  - type: managed_file_content
    path: /etc/jumptotech/app.conf
    hosts: all
    contains:
      - app_name=ledger
      - app_port=9090
      - app_release=2.4.1
    not_contains:
      - "{{"
    label: Both nodes hold a fully rendered configuration
  - type: managed_file_content
    path: /etc/jumptotech/app.conf
    hosts: [node2]
    contains:
      - served_by=node2
    label: The configuration is rendered per host
  - type: managed_file_content
    path: /var/log/jumptotech/reload.log
    hosts: all
    contains:
      - reloaded ledger
    label: The handler ran on both nodes
  - type: ansible_idempotent
    playbook: site.yml
    require_initial_change: true
    reset_paths:
      - /etc/jumptotech
      - /var/log/jumptotech
    label: From a clean node the playbook converges — it changes, then it does not

setup:
  workspace_dir: workspace
  verify:
    - type: file_exists
      path: site.yml
      label: The inherited playbook is in place
    - type: file_exists
      path: inventory.ini
      label: The inherited inventory is in place

hints:
  - level: 1
    text: >
      Run the three read-only tools in order before you change anything:
      `ansible-inventory --list`, then `ansible all -m ping`, then
      `ansible-playbook --syntax-check site.yml`. Each one tells you about a
      different layer, and the first one to complain is the one to fix first.
  - level: 2
    text: >
      Not every fault produces an error. A play whose `hosts:` pattern matches
      nothing reports zero hosts and exits successfully; a `notify:` naming a
      handler that does not exist notifies nothing. Compare what the inventory
      says the group is called with what the playbook asks for, and compare the
      handler's name with the string that notifies it — character for character.
  - level: 3
    text: >
      Also check the two places a value can silently be the wrong one: the name
      a variable is defined under versus the name the template asks for, and the
      filename the template task names versus the file that actually exists.
      When a run reaches a task and fails inside it, `-v` prints the module's own
      message, which usually names the argument it did not like.

references:
  - title: Ansible playbooks
    url: https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_intro.html
  - title: ansible-inventory
    url: https://docs.ansible.com/ansible/latest/cli/ansible-inventory.html
  - title: Connection methods and details
    url: https://docs.ansible.com/ansible/latest/inventory_guide/connection_details.html
  - title: Handlers - running operations on change
    url: https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_handlers.html
  - title: ansible.builtin.template module
    url: https://docs.ansible.com/ansible/latest/collections/ansible/builtin/template_module.html

skills:
  - ansible.troubleshooting.diagnose
  - ansible.troubleshooting.syntax
  - ansible.troubleshooting.connectivity
  - ansible.idempotency.verify

certification:
  - certification: RHCE
    relevant: true
    domains:
      - create-ansible-plays-and-playbooks
      - use-ansible-variables-and-facts
