id: DOCKER-009
slug: docker-009-resource-limits
title: Constrain a Container with Resource Limits
track: docker
topic: resources
difficulty: intermediate
level: practice
duration_minutes: 35
order: 9

environment:
  provider: docker
  isolation: container

prerequisites:
  - DOCKER-001

story: >
  The reporting job at JumpToTech Bank is the noisy neighbour of the batch
  host. Left alone it will take every core it can see and grow its heap until
  something else on the machine is starved.

  A container with no limits is not isolated in any meaningful sense — it
  shares the host's memory and CPU with everything else. The platform team's
  rule is that a container gets an explicit budget.

objectives:
  - Explain what a container with no resource limits can do to its host
  - Apply memory and CPU limits when starting a container
  - Read back the limits the daemon is actually enforcing
  - Distinguish a limit from a reservation

task:
  summary: Run a reporting container limited to 256m of memory and half a CPU.
  description: >
    Docker applies resource limits through the kernel's cgroups. A limit is a
    ceiling the kernel enforces: exceed the memory limit and the process is
    killed, ask for more CPU than the quota allows and it is throttled.

    Run a container named `reporting`, from `alpine:3.20`, leave it running,
    and give it exactly this budget:

      - a memory limit of `256m`
      - a CPU limit of `0.5`

    Then read back what the daemon actually applied.
    `docker inspect reporting` reports `HostConfig.Memory` in **bytes**, so
    `256m` appears as `268435456`, and `HostConfig.NanoCpus` in billionths of a
    CPU, so `0.5` appears as `500000000`. `docker stats` shows live usage
    against those limits.

    This lab accepts any spelling of the same limit: `256m`, `256M`, and the
    raw byte count all produce the same value in the daemon, and all pass.

setup:
  docker:
    images:
      - alpine:3.20
  verify:
    - type: docker_image_exists
      image: alpine:3.20
      label: The alpine:3.20 image is available
  verify_timeout_seconds: 120

requirements:
  - type: docker_container_running
    name: reporting
    label: Container reporting is running
  - type: docker_container_resource_limit
    name: reporting
    memory: 256m
    cpus: "0.5"
    label: Container is limited to 256m of memory and 0.5 CPU

reset:
  docker:
    containers: true
    volumes: true
    networks: true
    images: false
    workspace: true

hints:
  - level: 1
    text: >
      Both limits are set when the container is created, as options to the same
      command you have used all along. Neither can be added to a container
      after the fact without updating it.
  - level: 2
    text: >
      The resource constraints documentation covers memory and CPU separately.
      Read the memory section carefully: there is an option that sets a hard
      limit and another that sets a soft reservation, and this lab wants the
      hard one. For CPU, the modern option expresses a fraction of a core
      directly rather than as a period and a quota.
  - level: 3
    text: >
      The memory value takes a unit suffix — `256m` means 256 MiB. The CPU
      value is a plain decimal, so half a core is `0.5`. As in the earlier
      labs, `alpine:3.20` needs a long-running command or it will exit before
      you can inspect it. Confirm with
      `docker inspect reporting --format '{{.HostConfig.Memory}} {{.HostConfig.NanoCpus}}'`,
      which should print `268435456 500000000`.

references:
  - title: Runtime options with Memory, CPUs, and GPUs
    url: https://docs.docker.com/engine/containers/resource_constraints/
  - title: Docker CLI reference — docker run
    url: https://docs.docker.com/reference/cli/docker/container/run/
  - title: Docker CLI reference — docker stats
    url: https://docs.docker.com/reference/cli/docker/container/stats/

skills:
  - docker.resources.limits
  - docker.containers.run
  - docker.containers.inspect

certification:
  - certification: DCA
    relevant: true
    domains:
      - installation-and-configuration
