# ---------------------------------------------------------------------------
# JumpToTech Labs — lab definition
#
# Content is written from the official Docker documentation only; the pages
# this lab is grounded in are listed under `references`.
#
# WHY THIS LAB GRADES ARGV ARRAYS EXACTLY.
#
# The bug this lab teaches is silent. Written in exec form,
#
#     ENTRYPOINT ["/app/batch.sh"]
#
# gives a container `Config.Entrypoint = ["/app/batch.sh"]`, and a runtime
# argument replaces `Config.Cmd`, so the script receives it. Written in shell
# form,
#
#     ENTRYPOINT /app/batch.sh
#
# gives `Config.Entrypoint = ["/bin/sh","-c","/app/batch.sh"]` — and every
# runtime argument is discarded. Measured on a real daemon: the shell-form
# image runs, prints `mode=none` for `docker run … --commit`, and would exit 0
# if the script tolerated it. Nothing about "did it start" or "what did it
# exit with" separates the two. The argv array does, which is why these checks
# compare it exactly rather than testing membership.
#
# The seeded script closes the gap from the other side too: it rejects an
# empty mode with exit 64, so a shell-form entrypoint fails on the exit code as
# well as on the array. Two independent signals for one mistake.
#
# Verification is state-based. `docker_image_config` reads the image the
# student built; `docker_container_command` reads `Config.Entrypoint` and
# `Config.Cmd` on the containers they ran. Nothing reads the Dockerfile text
# for its meaning, and nothing reads command history.
# ---------------------------------------------------------------------------
id: DOCKER-014
slug: docker-014-cmd-entrypoint
title: Build a Tool That Takes Arguments
track: docker
topic: dockerfile
difficulty: intermediate
level: practice
duration_minutes: 50
order: 14

environment:
  provider: docker
  isolation: container

prerequisites:
  - DOCKER-004

story: >
  The batch tool at JumpToTech Bank is packaged as an image, and it has one
  job: run the nightly ledger batch in whichever mode the operator asks for.

  The operations runbook says the tool is invoked like any other command-line
  program — `docker run jumptotech/batch:1.0 --commit` to commit a batch, and
  plain `docker run jumptotech/batch:1.0` to do the safe thing by default.

  Nobody has packaged it yet. The script exists; turning it into an image that
  behaves the way the runbook describes is your job.

objectives:
  - Explain the difference between CMD and ENTRYPOINT in a Dockerfile
  - Use CMD to supply default arguments that a runtime argument can replace
  - Use ENTRYPOINT so the program itself cannot be replaced by a runtime argument
  - Explain why the exec form and the shell form of these instructions behave differently
  - Read the entrypoint and command a container was actually created with

task:
  summary: Package the batch script as an image that runs in a default mode with no arguments, and accepts a different mode as a runtime argument.
  description: >
    `batch.sh` is already in your workspace. Read it first — it takes one
    argument, accepts two modes, and refuses anything else.

    Write a `Dockerfile` that builds it into an image tagged
    `jumptotech/batch:1.0`, based on `alpine:3.20`. The image must behave
    exactly like the runbook describes:

      - `docker run jumptotech/batch:1.0` with no arguments must run the script
        in `--dry-run` mode, because that is the safe default.
      - `docker run jumptotech/batch:1.0 --commit` must run the *same script*
        in `--commit` mode. The argument selects the mode; it must not replace
        the program.

    That second requirement is the whole exercise. A Dockerfile can start a
    program in more than one way, and the ways differ in what happens to
    arguments supplied at run time — one of them passes them to your program,
    another replaces your program with them, and a third quietly throws them
    away while still appearing to work. The official reference for CMD and
    ENTRYPOINT describes each form and how they combine; it is worth reading
    the table before you write anything.

    Then prove the image behaves correctly by running it twice:

      - a container named `batch-default`, started with no arguments
      - a container named `batch-override`, started with `--commit`

    Both must finish successfully. The script's exit code is not decorative —
    it refuses a mode it does not recognise, and it refuses an empty one, so a
    container that exits non-zero is telling you the argument never arrived.

    Everything here is graded from the image and the containers you produce,
    never from the text of your Dockerfile or the commands you typed. Two
    students who reach the same image configuration by different routes both
    pass.

setup:
  docker:
    images:
      - alpine:3.20
    files:
      - path: batch.sh
        content: |
          #!/bin/sh
          # JumpToTech Bank — nightly ledger batch.
          #
          # Takes exactly one argument: the mode to run in. Anything else,
          # including no argument at all, is refused.
          mode="${1:-}"
          case "$mode" in
            --dry-run)
              echo "batch: dry run — reconciling, no ledger writes"
              exit 0
              ;;
            --commit)
              echo "batch: committing the nightly ledger batch"
              exit 0
              ;;
            "")
              echo "batch: no mode given; refusing to guess" >&2
              exit 64
              ;;
            *)
              echo "batch: unknown mode '$mode'" >&2
              exit 64
              ;;
          esac
  verify:
    - type: docker_image_exists
      image: alpine:3.20
      label: The alpine:3.20 base image is available
    - type: workspace_file_exists
      path: batch.sh
      label: The batch.sh script is in the workspace
  verify_timeout_seconds: 120

# Eight checks, all reading state the student produced.
#
# The image checks prove the packaging is right: the entrypoint is the script
# itself in exec form, and the default mode lives in CMD where a runtime
# argument can replace it. The container checks prove it actually behaves that
# way: both containers share an untouched entrypoint, and only the command
# differs between them.
requirements:
  - type: workspace_file_exists
    path: Dockerfile
    label: A Dockerfile exists in your workspace
  - type: dockerfile_valid
    path: Dockerfile
    base_image: alpine:3.20
    requires:
      - FROM
      - COPY
      - ENTRYPOINT
      - CMD
    label: The Dockerfile builds on alpine:3.20 and uses COPY, ENTRYPOINT, and CMD
  - type: docker_image_exists
    image: jumptotech/batch:1.0
    label: Image jumptotech/batch:1.0 was built
  # Exact argv on both halves. The shell form of ENTRYPOINT would read
  # ["/bin/sh", "-c", ...] here and fail, which is the point.
  - type: docker_image_config
    image: jumptotech/batch:1.0
    entrypoint:
      - /app/batch.sh
    cmd:
      - --dry-run
    label: The image runs the script directly, with --dry-run as its default mode

  # --- run with no arguments: the default applies --------------------------
  - type: docker_container_command
    name: batch-default
    entrypoint:
      - /app/batch.sh
    command:
      - --dry-run
    label: batch-default took the image's default mode
  - type: docker_container_exit_code
    name: batch-default
    expected: 0
    label: batch-default completed successfully

  # --- run with an argument: it replaces the command, not the program ------
  - type: docker_container_command
    name: batch-override
    entrypoint:
      - /app/batch.sh
    command:
      - --commit
    label: batch-override replaced the mode while keeping the same program
  - type: docker_container_exit_code
    name: batch-override
    expected: 0
    label: batch-override completed successfully

# `Reset Lab` restores this session's Docker environment to its baseline: the
# containers and the image the student built are removed and `batch.sh` is
# re-seeded, so a previous pass leaves nothing behind.
reset:
  docker:
    containers: true
    volumes: true
    networks: true
    # The student's own `jumptotech/batch:1.0` is removed by the reset; only
    # the lab's declared base images survive, so a rebuild is genuinely a
    # rebuild.
    images: true
    workspace: true

hints:
  - level: 1
    text: >
      Read `batch.sh` before anything else. It tells you what a correct
      invocation looks like, and its exit codes tell you when one is wrong.

      Then think about the two things a Dockerfile can fix about how a
      container starts: *which program runs*, and *what arguments it gets*.
      Those are two different instructions, and the runbook asks you to make
      only one of them replaceable at run time.
  - level: 2
    text: >
      The official CMD and ENTRYPOINT reference has a table showing what
      happens for each combination when a container is started with and
      without arguments. Find the row where the program stays fixed and the
      arguments are replaceable — that is the behaviour the runbook describes.

      Both instructions also have two spellings. One is a JSON array; the
      other is a bare string that Docker wraps in a shell. The wrapped form is
      the reason an argument can disappear without any error at all, so prefer
      the array form for both.
  - level: 3
    text: >
      Your script needs to be inside the image and executable before it can be
      an entrypoint — `COPY` puts it there, and it needs the executable bit
      set, either before you build or with a `RUN` afterwards. The checks
      expect it at `/app/batch.sh`.

      To see what you actually built,
      `docker inspect jumptotech/batch:1.0 --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}'`
      shows the image's two halves, and the same format string against a
      container name shows what that container was created with. Compare
      `batch-default` and `batch-override`: the entrypoint should be identical
      and only the command should differ.

references:
  - title: Dockerfile reference — CMD
    url: https://docs.docker.com/reference/dockerfile/#cmd
  - title: Dockerfile reference — ENTRYPOINT
    url: https://docs.docker.com/reference/dockerfile/#entrypoint
  - title: Dockerfile reference — understand how CMD and ENTRYPOINT interact
    url: https://docs.docker.com/reference/dockerfile/#understand-how-cmd-and-entrypoint-interact
  - title: Docker CLI reference — docker container run
    url: https://docs.docker.com/reference/cli/docker/container/run/
  - title: Docker CLI reference — docker image inspect
    url: https://docs.docker.com/reference/cli/docker/image/inspect/

skills:
  - docker.dockerfile.author
  - docker.images.build
  - docker.images.inspect
  - docker.containers.run
  - docker.containers.inspect

# Checked against the official Docker Certified Associate Study Guide v1.5
# (January 2025), published by Mirantis, which administers the exam.
#
# Domain 2, Image Creation, Management, and Registry, lists "Describe options,
# such as add, copy, volumes, expose, entrypoint" — entrypoint by name — and
# "Describe the use of Dockerfile". This lab practises both directly.
#
# The exec-form versus shell-form distinction, and the argument-passing
# behaviour that follows from it, is a PRODUCTION SKILL: the guide does not
# mention it. See docs/docker/CERTIFICATION-AUDIT.md.
certification:
  - certification: DCA
    relevant: true
    domains:
      - image-creation-and-registry
