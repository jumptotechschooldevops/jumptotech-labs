# (January 2025), published by Mirantis, which administers the exam.
#
# Domain 1 lists "Interpret the output of `docker inspect` commands", which
# this lab practises directly. That is the only DCA objective it touches: the
# guide has nothing about `docker logs`, `docker exec`, or diagnosing a
# misconfigured running container.
#
# Everything else here is a PRODUCTION SKILL (DevOps / SRE, container
# troubleshooting). See docs/docker/CERTIFICATION-AUDIT.md.
certification:
  - certification: DCA
    relevant: true
    domains:
      - orchestration
