# ---------------------------------------------------------------------------
# JumpToTech Labs — lab definition
#
# This file is the single source of truth for the lab. The API loads it at
# runtime and serves it to the frontend; nothing about this task is hardcoded
# in React or in the verifier.
#
# PLATFORM-002 note: there is deliberately no `namespace:` field anywhere in
# this file. Each student session gets its own generated namespace, and both
# the terminal and the verifier are scoped to it by the session record. A lab
# can no longer name the namespace it runs in — that is what stops one
# student's lab content from reaching another student's sandbox.
#
# Content is written from the official Kubernetes documentation only.
# ---------------------------------------------------------------------------
id: K8S-001
slug: k8s-001-pods
title: Create Your First Pod
track: kubernetes
topic: pods
difficulty: beginner
level: practice
duration_minutes: 30
order: 1

environment:
  provider: kubernetes
  isolation: namespace

prerequisites: []

story: >
  You have joined the platform team at JumpToTech Bank. Every service the bank
  runs — the customer frontend, the accounts API, the overnight reconciliation
  jobs — eventually runs as a container on Kubernetes.

  Before you are handed anything that customers depend on, your team lead wants
  to see you run a single container in the cluster yourself and confirm it is
  actually healthy. That is the whole task today.

objectives:
  - Explain what a Pod is and why it is the unit Kubernetes schedules
  - Create a single-container Pod in your own namespace
  - Confirm a Pod is both Running and Ready using kubectl

task:
  summary: Create a Kubernetes Pod named nginx using the nginx:stable image.
  description: >
    A Pod is the smallest deployable unit in Kubernetes. It groups one or more
    containers that share storage and network resources, and a specification
    for how to run those containers.

    In this lab you will create a single-container Pod in your own private lab
    namespace and confirm that it reaches the Running state. Your terminal is
    already pointed at that namespace, so plain `kubectl get pods` shows your
    work and nothing else.

# Verification is state-based: the verifier reads the live Kubernetes API in
# this session's namespace, and never inspects the student's command history.
requirements:
  - type: pod_exists
    name: nginx
    label: Pod nginx exists
  - type: pod_image
    name: nginx
    image: nginx:stable
    label: Image nginx:stable is correct
  - type: pod_running
    name: nginx
    label: Pod is Running
  - type: pod_ready
    name: nginx
    label: Container is Ready

# `Reset Lab` restores this session's namespace to its baseline: every
# workload-ish resource the student created is removed, and nothing is applied
# back. The session, its namespace, and its guardrails all survive.
reset:
  purge_namespaced_resources:
    - pods
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - jobs
    - cronjobs
    - services
    - configmaps
    - secrets
  # Cluster-managed objects that always exist in a namespace and must survive.
  # The platform's own guardrails (quota, limits, RBAC, network policy) are
  # protected unconditionally in code and do not need listing here.
  protected_resources:
    - services/kubernetes
    - configmaps/kube-root-ca.crt

hints:
  - level: 1
    text: >
      A Pod can be created either from a Kubernetes manifest or with an
      appropriate kubectl command.
  - level: 2
    text: >
      Consult the official Kubernetes Pod and kubectl documentation. Your
      terminal already defaults to your lab namespace, so you do not need to
      pass a namespace flag.
  - level: 3
    text: >
      The Pod must end up named exactly `nginx` and running the `nginx:stable`
      image. After creating it, watch it settle with `kubectl get pods`: a Pod
      reports Running before its container reports Ready, and this lab checks
      both. If it never becomes Ready, `kubectl describe pod nginx` shows the
      events explaining why.

references:
  - title: Kubernetes Pods
    url: https://kubernetes.io/docs/concepts/workloads/pods/
  - title: kubectl
    url: https://kubernetes.io/docs/reference/kubectl/

skills:
  - kubernetes.pods.create
  - kubernetes.pods.inspect

