# ---------------------------------------------------------------------------
# JumpToTech Labs — lab definition
#
# K8S-018 teaches the DaemonSet controller model by handing the student the
# mistake it exists to prevent: a node agent deployed as a Deployment with a
# replica count. The object is not broken — three Pods run happily — it is
# simply managed by a controller that cannot express what the workload needs.
#
# That framing matters. "Create an object with kind: DaemonSet" is a typing
# exercise; recognising that a replica count and a per-node guarantee are
# different things is the actual skill, and the single-node cluster makes the
# gap visible rather than hiding it — all three replicas land on the same node,
# so the fleet has three agents watching one node and would give a new node
# none.
#
# The `resource_absent` check on the old Deployment is deliberate. Adding a
# DaemonSet beside the Deployment leaves the cluster in the state the lab is
# supposed to fix, so replacing rather than accumulating is graded.
#
# ---------------------------------------------------------------------------
# SINGLE-NODE HONESTY
#
# This development cluster has exactly one schedulable node, so a correct
# DaemonSet produces exactly one Pod. That is the controller behaving
# correctly, not a coincidence and not proof of anything about multi-node
# behaviour — and the task text says so in as many words rather than letting a
# student generalise from n=1.
#
# The checks are written in DaemonSet terms rather than as "expect 1 Pod":
# `daemonset_scheduled` reads `status.desiredNumberScheduled`, which is the
# controller's own count of eligible nodes, and the requirement asks for *at
# least* one. On a three-node cluster the same lab passes with three Pods and
# no edit, because the assertion is about the controller's semantics, not about
# this laptop.
#
# ---------------------------------------------------------------------------
# SOURCE METADATA (official-source curriculum policy)
#
# Carried as a comment, not as fields: `labDefinitionSchema` is `.strict()`.
#
# classification:       CERTIFICATION OBJECTIVE
# certification:        CKA
# objective_version:    v1.35 (CNCF curriculum, Kubernetes v1.35)
# official_objective:   "Understand primitives for robust, self-healing
#                        application deployments" — Workloads & Scheduling (15%)
# objective_mapping:    The DaemonSet is one of the workload controllers that
#                        bullet covers, and the lab is about choosing the right
#                        controller for a guarantee rather than about YAML.
#                        K8S-016 serves the same bullet from the container-
#                        composition side; this is a distinct primitive, not a
#                        second pass at the same material.
# production_skill:     Recognising that "one per node" is a scheduling
#                        guarantee no replica count can provide — the mistake
#                        behind most home-grown node agents.
# foundational:         The controller model itself — a desired state, a set of
#                        eligible nodes, and a controller reconciling one
#                        against the other. Transfers to every other Kubernetes
#                        controller.
#
# official_documentation:
#   - https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
#     verified 2026-08-25: a DaemonSet ensures all (or some) nodes run a copy
#     of a Pod; as nodes are added Pods are added to them, and as nodes are
#     removed those Pods are garbage collected. Typical uses given are a
#     cluster storage daemon, a logs collection daemon and a node monitoring
#     daemon. `.spec.selector` is immutable after creation and must match
#     `.spec.template.metadata.labels`.
#   - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
#   - https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/
# last_verified:        2026-08-25
# ---------------------------------------------------------------------------
id: K8S-018
slug: k8s-018-daemonsets
title: Run an Agent on Every Node
track: kubernetes
topic: workloads
difficulty: intermediate
level: practice
duration_minutes: 35
order: 18

environment:
  provider: kubernetes
  isolation: namespace

prerequisites:
  - K8S-002

story: >
  Platform engineering ships a small collection agent that is supposed to run
  on every node in the cluster — one per node, appearing automatically on any
  node that joins, and disappearing with any node that leaves.

  It was rolled out as a Deployment with three replicas, because three was the
  size of the cluster on the day it shipped. The cluster has been resized twice
  since. Nobody noticed, because a Deployment with three replicas is perfectly
  happy running all three on one node and none on the others — which, as it
  turns out, is exactly what it has been doing.

  The agent itself is fine. The controller managing it is the wrong one.

objectives:
  - Recognise when a per-node guarantee is needed and a replica count cannot give it
  - Replace a Deployment with a DaemonSet that carries the same workload
  - Explain how a DaemonSet decides how many Pods it wants
  - Read DaemonSet status with kubectl and say what each column means

task:
  summary: Replace the node-agent Deployment with a DaemonSet that runs one agent per eligible node.
  description: >
    Look at what is running first. `node-agent` is a Deployment with three
    replicas — check which nodes those three Pods are actually on, and what
    that means for a cluster whose size changes.

    Replace it with a workload managed by the controller that does make a
    per-node guarantee. Keep the name `node-agent`, the image `busybox:1.36`,
    and the labels `app=node-agent` and `tier=infrastructure`. The old
    Deployment must be gone when you are finished — a DaemonSet running
    alongside it leaves the cluster in exactly the state you were asked to fix.

    Then read the new workload's status and make sure you can say what it is
    telling you. `kubectl get daemonset` has columns for how many Pods the
    controller *wants*, how many exist, and how many are ready. Where does the
    number it wants come from? It is not something you typed.

    A note on this environment, so you do not draw the wrong conclusion from
    it: this development cluster has one schedulable node, so a correct
    DaemonSet here creates exactly one Pod. That is the controller working, not
    a special case — on a ten-node cluster the same object would create ten,
    and you would not have changed a thing. One Pod here proves the controller
    is running; it does not demonstrate the per-node behaviour, which needs
    more than one node to see.

setup:
  manifests:
    - setup/node-agent.yaml
  verify:
    - type: deployment_exists
      name: node-agent
    - type: deployment_available
      name: node-agent
      min_available: 3
  verify_timeout_seconds: 240

# Graded on live DaemonSet state. `daemonset_scheduled` and `daemonset_ready`
# read `status.desiredNumberScheduled` and `status.numberReady`, which the
# DaemonSet controller computes and writes — so no loose Pod, Deployment, or
# hand-labelled object can satisfy them, whatever it is called or labelled.
requirements:
  - type: daemonset_exists
    name: node-agent
    label: A DaemonSet named node-agent exists
  - type: daemonset_image
    name: node-agent
    image: busybox:1.36
    label: The DaemonSet runs the agent image
  - type: daemonset_selector
    name: node-agent
    selector:
      app: node-agent
      tier: infrastructure
    label: The DaemonSet selects the agent Pods
  - type: daemonset_scheduled
    name: node-agent
    min_scheduled: 1
    label: The controller wants a Pod on every eligible node
  - type: daemonset_ready
    name: node-agent
    min_ready: 1
    label: The agent is Ready on every node the controller scheduled it to
  - type: resource_absent
    kind: deployment
    name: node-agent
    label: The old node-agent Deployment is gone

hints:
  - level: 1
    text: >
      A Deployment answers "how many of these should exist". Some workloads
      need a different question answered — "which machines should be running
      one of these" — and Kubernetes has a separate controller for it. Look at
      what `kubectl get pods -o wide` says about where the three replicas are.
  - level: 2
    text: >
      The workload controller you want takes no replica count at all, because
      the number is derived rather than declared. Consult the DaemonSet
      documentation for its shape — note that its selector, like a
      Deployment's, is immutable once created and must match the labels on its
      own Pod template.
  - level: 3
    text: >
      Write a `DaemonSet` with the same Pod template the Deployment had, a
      `selector.matchLabels` of `app: node-agent` and `tier: infrastructure`,
      and no `replicas` field — a DaemonSet has none. Delete the old Deployment
      once the DaemonSet is running. `kubectl get daemonset node-agent` then
      shows DESIRED, CURRENT and READY; DESIRED comes from the number of nodes
      the controller considers eligible, which you can compare against what
      `kubectl get nodes` would show if you had permission to run it.

references:
  - title: DaemonSet
    url: https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  - title: Expose Pod Information to Containers Through Environment Variables
    url: https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/

skills:
  - kubernetes.daemonsets.create
  - kubernetes.workloads.controllers
  - kubernetes.workloads.inspect
  - kubernetes.scheduling.placement

certification:
  - certification: CKA
    relevant: true
    domains:
      - workloads-and-scheduling
