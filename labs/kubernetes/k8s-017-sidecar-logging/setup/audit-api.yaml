# K8S-017 initial state — a healthy service whose logs nobody can read.
#
# Nothing here is broken. `audit-api` runs, stays Ready, and serves its purpose;
# it simply writes its audit trail to a file inside its own container, where the
# platform's log collection cannot see it. That is the whole point: the lab is
# about observability, not availability, and a student who goes looking for a
# crash will not find one.
#
# No volume is declared. K8S-016 seeded the shared volume and asked for the
# producer; here the *sharing itself* is the lesson, so the student builds both
# the volume and the container that reads it.
#
# `maxUnavailable: 1` for the reason K8S-016 documents: these replicas stay
# Ready, but a student iterating toward the answer should never be blocked by a
# rollout that cannot retire a Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-api
  labels:
    app: audit-api
    tier: api
    jumptotech.io/lab-fixture: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: audit-api
      tier: api
  template:
    metadata:
      labels:
        app: audit-api
        tier: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          # Writes an audit trail to a file, exactly as a real service with a
          # file-based logger would. Nothing about this container changes.
          command:
            - sh
            - -c
            - >
              mkdir -p /var/log/audit;
              while true; do
                echo "$(date -Iseconds) audit: request served" >> /var/log/audit/audit.log;
                sleep 5;
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
