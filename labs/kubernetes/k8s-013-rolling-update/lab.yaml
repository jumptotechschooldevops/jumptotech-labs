# ---------------------------------------------------------------------------
# JumpToTech Labs — lab definition
#
# K8S-013 is the track's first lab about *changing* a running workload rather
# than creating one. Everything it verifies already exists in the requirement
# vocabulary; no new verifier capability was added for it.
#
# The check that carries the lesson is `deployment_selector`. A Deployment's
# selector is immutable in apps/v1, and this one has two labels, so a student
# who deletes the Deployment and recreates it with `kubectl create deployment`
# cannot reproduce it. Updating in place is therefore not merely the taught
# route — it is the only route that passes.
#
# As everywhere else in this track there is no `namespace:` field: the session
# owns its namespace, and both the terminal and the verifier are scoped to it.
#
# ---------------------------------------------------------------------------
# SOURCE METADATA (official-source curriculum policy)
#
# Carried as a comment, not as fields: `labDefinitionSchema` is `.strict()`,
# so `sources:` / `official_objective:` / `last_verified:` would be rejected by
# the loader until the shared schema is extended. See the curriculum plan for
# the proposed extension.
#
# classification:       CERTIFICATION OBJECTIVE
# certification:        CKA
# objective_version:    v1.35 (CNCF curriculum, Kubernetes v1.35)
# official_objective:   "Understand application deployments and perform rolling
#                        updates/rollbacks" — Workloads & Scheduling (15%)
# objective_source:     https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/
#                       https://github.com/cncf/curriculum
# objective_mapping:    Covers the "rolling updates" half of the objective.
#                       The "rollbacks" half is deliberately left to K8S-014,
#                       which needs `deployment_revision` to grade honestly.
# coverage_depth:       PRACTICED
#
# official_documentation:
#   - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
#     verified: a rollout is triggered "if and only if the Deployment's Pod
#     template (that is, .spec.template) is changed"; scaling does not trigger
#     one. "Label selector updates": "the selector field is immutable after
#     creation". "Complete Deployment": all replicas updated to the latest
#     version, all available, and none of the old replicas running — which is
#     exactly what the `deployment_rollout_complete` handler asserts.
#     `minReadySeconds` defaults to 0; `maxSurge`/`maxUnavailable` default to 25%.
#   - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/
#     verified: `status`, `history`, `undo`, `pause`, `resume`, `restart`.
#   - https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/deployment-v1/
#     verified: DeploymentSpec field semantics for selector and minReadySeconds.
#   - https://kubernetes.io/docs/tutorials/kubernetes-basics/update/update-intro/
# last_verified:        2026-08-23
#
