  - title: Python — sys.argv
    url: https://docs.python.org/3/library/sys.html
  - title: Python — format specification mini-language
    url: https://docs.python.org/3/library/string.html
  - title: Python — built-in types, integers and formatting
    url: https://docs.python.org/3/library/stdtypes.html
  - title: Resource Management for Pods and Containers — Kubernetes
    url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

skills:
  - cs.data.binary
  - cs.data.hexadecimal
  - cs.units.si-vs-iec
  - cs.programming.argv
  - cs.programming.executable-script

