# Recorded here as comments rather than as schema fields: a `sources:` /
# `last_verified:` block would be a change to the shared lab schema, which this
# track is not permitted to make unilaterally. See the curriculum plan for the
# proposed schema extension.
#
# last_verified: 2026-08-23
#
# Certification objectives — read from the official Linux Foundation LFCS
# certification page on 2026-08-23:
#   https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
#   Current domains and weights (distribution-agnostic exam, effective
#   2023-05-11 per the Linux Foundation's own announcement):
#     Operations Deployment 25% · Networking 25% · Storage 20% ·
#     Essential Commands 20% · Users and Groups 10%
#
#   This lab maps to three published competencies:
#     Essential Commands    "Create, configure, and troubleshoot services"
#     Users and Groups      "Manage personal and system-wide environment
#                            profiles"
#     Operations Deployment "Diagnose, identify, manage, and troubleshoot
#                            processes and services"
#
#   Caveat stated plainly: LFCS is examined on systemd-based hosts. The
#   *environment* half of this lab — how a process receives its environment,
#   which startup files a shell reads, how PATH resolution works — is portable
#   and is the examined skill. The *supervisor* half is runit, because a
#   container does not run systemd and this platform does not fake one. That
#   half is a production skill, not an exam objective, and the task text says
#   so rather than implying otherwise.
#
# Technical objectives — verified against upstream documentation on 2026-08-23:
#   GNU Bash manual, "Bash Startup Files": "When Bash runs as an interactive
#     shell that is not a login shell, it reads and executes commands from
#     ~/.bashrc, if that file exists." A login shell instead reads /etc/profile
#     then the first of ~/.bash_profile, ~/.bash_login, ~/.profile. The
#     platform attaches a student with `docker exec … bash`, which is
#     interactive and not a login shell — so the seed's .bashrc append is read
#     by the student's shell and ~/.profile is not.
#   environ(7): the environment "is made available to the process by the
#     execve(2) call when a new program is started", and PATH is "the sequence
#     of directory prefixes that sh(1) and many other programs employ when
#     searching for an executable file that is specified as a simple
#     filename". Both are exactly the mechanism this lab is about: `runsv`
#     execs the run script with runsvdir's environment and nothing else.
# ---------------------------------------------------------------------------
certification:
  - certification: LFCS
    relevant: true
    # Current official domain slugs, verified 2026-08-23. Note that
    # `operation-of-running-systems`, used elsewhere in this track, is a
    # retired domain that the current curriculum no longer contains.
    domains:
      - essential-commands
      - users-and-groups
      - operations-deployment
