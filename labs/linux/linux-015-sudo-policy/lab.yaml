# (domains: Operations Deployment 25%, Networking 25%, Storage 20%, Essential
# Commands 20%, Users and Groups 10%). The words `sudo`, `sudoers`, privilege
# delegation and least privilege appear nowhere in it. The nearest access
# control competency is "Configure and manage ACLs", which is a different
# mechanism and is not what this lab teaches.
#
# So this lab claims no exam coverage. It is here because delegating a narrow
# capability to an on-call rotation is ordinary production work and a recurring
# audit finding — not because an exam asks for it. `certification.relevant` is
# recorded as false rather than omitted, so the check is on the record.
#
# Technical objectives verified on 2026-08-24 against the sudo project's own
# manual pages as published by Debian:
#   sudoers(5)  a command specification may name a command with the arguments
#               it may be given; a bare command name permits any arguments.
#               Files in an #includedir are ignored unless owned by root and
#               not writable by group or other.
#   sudo(8)     `-l` lists or tests the policy without executing; `-n` refuses
#               to prompt. Together they resolve a policy with no side effects,
#               which is what makes a continuous probe safe here.
# ---------------------------------------------------------------------------
certification:
  - certification: LFCS
    relevant: false
    domains: []
