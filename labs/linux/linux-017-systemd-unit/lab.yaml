# SOURCE VERIFICATION
#
# Recorded as comments rather than schema fields: a `sources:` / `last_verified:`
# block would be a change to the shared lab schema, which this track is not
# permitted to make unilaterally.
#
# last_verified: 2026-08-25
#
# CLASSIFICATION
#
#   CERTIFICATION OBJECTIVE  partial — see below
#   PRODUCTION SKILL         yes; writing and reviewing unit files is most of
#                            the systemd work an engineer actually does
#   FOUNDATIONAL KNOWLEDGE   service supervision as a concept: identity,
#                            dependency ordering, restart policy, enablement
#
# On the certification claim, stated carefully. "Create, configure, and
# troubleshoot services" is a published LFCS competency under Essential
# Commands, read from the Linux Foundation's certification page on 2026-08-25,
# and LFCS is examined on systemd-based hosts. This lab covers the *configure*
# and part of the *troubleshoot* of that competency — the student diagnoses why
# a unit file would be rejected and corrects a policy that contradicts its
# specification.
#
# What it does not cover is the rest: the unit is never loaded, never started,
# and never inspected with `systemctl`, because this sandbox has no systemd and
# is not granted CAP_SYS_ADMIN. So `certification.relevant` is true and the
# domain is recorded, and the task text tells the student plainly that runtime
# behaviour is not being validated. A lab that let a student believe they had
# been examined on running services would be worse than one that admits the
# boundary.
#
# Technical objectives verified 2026-08-25 against the systemd project's manual
# pages as published by Debian:
#   systemd.syntax(7)   comment markers, line continuation, whitespace around
#                       `=`, and the rule that an empty assignment resets
#   systemd.unit(5)     After=/Wants=/Requires= take space-separated lists and
#                       "may be specified more than once, in which case
#                       dependencies for all listed names are created";
#                       WantedBy=/RequiredBy= likewise in [Install]
#
# RUNTIME LIMITATION, stated here as well as in the task text: nothing in this
# lab validates that the unit would start. The sandbox runs runit as PID 1,
# `systemctl` and `systemd-analyze` are not installed, and CAP_SYS_ADMIN is not
# in the platform's grantable set at all. Grading is static and semantic. The
# runit service is deliberately left running so the student has a working
# reference to compare against, which is the closest to runtime feedback this
# architecture can honestly offer.
# ---------------------------------------------------------------------------
certification:
  - certification: LFCS
    relevant: true
    domains:
      - essential-commands
