# ---------------------------------------------------------------------------
# JumpToTech Labs — the base stack.
#
# This file on its own runs the **Kubernetes track**: postgres, api, terminal,
# web, and no container runtime anywhere. It is the floor, and it is deliberately
# the least privileged arrangement the platform has.
#
# Everything beyond that is an overlay you name explicitly, because each one
# costs something and the cost should be visible in the command:
#
#   docker compose up
#       Kubernetes track. 19 labs. No Docker socket in any container.
#
#   docker compose -f docker-compose.yml -f docker-compose.runtime.yml up
#       + `sandboxd`, and every remaining track: Linux, Networking, CS, AWS,
#       Terraform, Ansible, CI/CD and Docker. All 114 labs. The socket is
#       mounted into `sandboxd` and nothing else.   (`make up`)
#
# ## Prerequisites, created on the host
#
#   npm run cluster:up      # Kubernetes track: kind cluster + kubeconfigs
#   make sandbox-build      # container tracks: the training images (once)
#
# Both happen outside any web-facing process, for the same reason the socket
# does: building an image and creating a cluster are privileged, and neither is
# something a running service should be able to do.
#
# ## Who holds what
#
#   api       ← a cluster credential and the database. No container runtime, for
#               any track: the container-backed ones go through the broker's
#               eleven verbs, the Docker track through its fourteen operations.
#   terminal  ← runs student PTYs. No cluster credential, no Docker socket, no
#               DOCKER_HOST, no ambient credential of any kind. Each PTY is
#               handed a namespace-scoped kubeconfig, or a sandbox-scoped client
#               certificate, or a broker socket — per session, deleted with the
#               shell.
#   sandboxd  ← (runtime overlay) the only process with a container runtime. Not
#               published to the host, not routed through the web proxy, refuses
#               any request carrying an `Origin` header.
#
# The rule those three lines encode: the one process a student can type into
# holds nothing, and the one process that holds a runtime never runs a student's
# command line — it runs `docker exec` into a container it derived itself from
# the session id and then label-checked.
#
# The api and terminal services join the `kind` Docker network so they can
# reach the cluster's API server directly at
# https://jumptotech-labs-control-plane:6443 — that is exactly the address in
# the generated `kubeconfig-internal.yaml`.
#
# PLATFORM-002: only the `api` service holds a cluster credential. The terminal
# no longer mounts a kubeconfig at all — it fetches a namespace-scoped
# ServiceAccount kubeconfig per session from the API, over the internal Docker
# network, authenticated with INTERNAL_SERVICE_SECRET.
#
# PLATFORM-005: PostgreSQL joins the stack and holds the one thing here that is
# not disposable — students, attempts, progress and hint usage. Two rules follow
# from that:
#
#   · only the `api` service can reach it. It is not on the `kind` network, the
#     web and terminal services have no credential for it, and a student's shell
#     could not resolve it even if it had one.
#   · its data lives in a named volume, so `docker compose down` keeps the
#     history. `docker compose down -v` is what deletes it, and `make clean`
#     says so.
# ---------------------------------------------------------------------------

# Project name. `COMPOSE_PROJECT_NAME` takes precedence over this value, which is
# how a second worktree runs its own stack alongside this one: every container,
# network and volume below is namespaced by the project, so two projects cannot
# collide. See docs/runtime-ownership.md.
name: ${COMPOSE_PROJECT_NAME:-jumptotech-labs}

x-kubeconfig: &kubeconfig
  # Read-only. Contains client credentials for the local throwaway cluster.
  type: bind
  source: ./infrastructure/kind/generated/kubeconfig-internal.yaml
  target: /etc/jumptotech/kubeconfig.yaml
  read_only: true

services:
  postgres:
    image: postgres:16-alpine
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      # Credentials come from .env and nowhere else. There is no default
      # password here or in application source; `make setup` generates one.
      POSTGRES_USER: ${POSTGRES_USER:-jumptotech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (make setup generates one)}
      POSTGRES_DB: ${POSTGRES_DB:-jumptotech_labs}
      # Deterministic collation, so a database created on a laptop and one
      # created in CI sort identically.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      # Named volume: the whole point of this story is that it survives.
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Published so `npm run db:migrate` and psql work from the host. Change
      # POSTGRES_PORT if 5432 is already taken on your machine.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # The api waits for this: migrations run at startup, and racing initdb
      # would fail the first boot for no reason.
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-jumptotech}" -d "${POSTGRES_DB:-jumptotech_labs}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # This file is the LOCAL DEVELOPMENT stack, and its AUTH_MODE default
      # below is `development`. Pinning NODE_ENV=production here as well made
      # the two contradict each other: `buildIdentityResolver` refuses that
      # combination by design, so the api exited 1 at startup and the shipped
      # stack could not come up at all.
      #
      # Defaulting to `development` makes the default coherent. The safety gate
      # is untouched and still fires on the case it was written for — a real
      # deployment whose NODE_ENV=production carries a stale
      # AUTH_MODE=development. A production run sets both:
      #
      #   NODE_ENV=production AUTH_MODE=oidc docker compose up -d
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      LAB_PROVIDER: ${LAB_PROVIDER:-kind}
      LAB_CLUSTER_NAME: ${LAB_CLUSTER_NAME:-jumptotech-labs}
      KUBECONFIG: /etc/jumptotech/kubeconfig.yaml
      LABS_DIR: /app/labs
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TERMINAL_SESSION_SECRET: ${TERMINAL_SESSION_SECRET:?set TERMINAL_SESSION_SECRET in .env (copy from .env.example)}
      TERMINAL_SESSION_TTL_SECONDS: ${TERMINAL_SESSION_TTL_SECONDS:-3600}
      # Fallback when no proxy forwards a public origin (local `npm run dev:*`).
      VITE_TERMINAL_WS_URL: ${VITE_TERMINAL_WS_URL:-ws://localhost:4001}
      # Optional explicit browser origin for start-lab terminal URLs (tunnel URL).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # Lets the API close a student's shell the moment their session ends.
      TERMINAL_CONTROL_URL: http://terminal:4001
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-${TERMINAL_SESSION_SECRET}}
      NAMESPACE_DERIVATION_SECRET: ${NAMESPACE_DERIVATION_SECRET:-${TERMINAL_SESSION_SECRET}}
      # --- authentication (PLATFORM-009 / PLATFORM-010) ---
      #
      # `development` is the compose default because a laptop has no identity
      # provider. It accepts whoever the caller says they are, and the API
      # refuses to start in this mode when NODE_ENV=production — so the stack
      # cannot be shipped this way by forgetting to change it.
      #
      # For a real deployment set AUTH_MODE=oidc and the four OIDC_* values.
      # OIDC_CLIENT_SECRET is what enables browser sign-in; it is a real secret
      # and reaches only this service, never the web container. See
      # docs/authentication.md.
      AUTH_MODE: ${AUTH_MODE:-development}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # The browser session cookie. `Secure` is derived — on unless the app URL
      # is visibly plain-HTTP localhost — so forgetting it gets the safe value.
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-jtt_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      # --- session lifetimes (PLATFORM-002) ---
      MAX_SESSION_MINUTES: ${MAX_SESSION_MINUTES:-60}
      IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-20}
      WARNING_MINUTES: ${WARNING_MINUTES:-5}
      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-20}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-60}
      SESSION_RETENTION_MINUTES: ${SESSION_RETENTION_MINUTES:-15}
      # --- per-session guardrails ---
      QUOTA_PODS: ${QUOTA_PODS:-15}
      QUOTA_SERVICES: ${QUOTA_SERVICES:-10}
      QUOTA_PVCS: ${QUOTA_PVCS:-5}
      QUOTA_REQUESTS_CPU: ${QUOTA_REQUESTS_CPU:-2}
      QUOTA_REQUESTS_MEMORY: ${QUOTA_REQUESTS_MEMORY:-2Gi}
      QUOTA_LIMITS_CPU: ${QUOTA_LIMITS_CPU:-4}
      QUOTA_LIMITS_MEMORY: ${QUOTA_LIMITS_MEMORY:-4Gi}
      LIMITS_DEFAULT_REQUEST_CPU: ${LIMITS_DEFAULT_REQUEST_CPU:-50m}
      LIMITS_DEFAULT_REQUEST_MEMORY: ${LIMITS_DEFAULT_REQUEST_MEMORY:-64Mi}
      LIMITS_DEFAULT_CPU: ${LIMITS_DEFAULT_CPU:-500m}
      LIMITS_DEFAULT_MEMORY: ${LIMITS_DEFAULT_MEMORY:-512Mi}
      NETWORK_POLICY_ENABLED: ${NETWORK_POLICY_ENABLED:-true}
      CLUSTER_POD_CIDR: ${CLUSTER_POD_CIDR:-10.244.0.0/16}
      CLUSTER_SERVICE_CIDR: ${CLUSTER_SERVICE_CIDR:-10.96.0.0/16}
      STUDENT_CREDENTIAL_TTL_SECONDS: ${STUDENT_CREDENTIAL_TTL_SECONDS:-3600}
      # --- container-backed tracks (PLATFORM-004) ---
      # Off in compose by design, and PINNED rather than defaulted.
      #
      # The original `${VAR:-false}` form assumed this container has no runtime
      # to drive. That stopped being true when the Docker track mounted the host
      # socket here: the api *can* create a Linux/Ansible/CI-CD sandbox, so the
      # provider reported itself available and the catalog offered those labs.
      # The terminal service still cannot attach a PTY to one — it is given no
      # runtime, deliberately — so a student who started such a lab got a
      # sandbox and then a dead shell:
      #
      #   TERMINAL_CONTAINER_EXEC_ENABLED=false → "CONTAINER_EXEC_DISABLED"
      #   TERMINAL_CONTAINER_EXEC_ENABLED=true  → "Cannot connect to the Docker
      #                                            daemon at /var/run/docker.sock"
      #
      # and `.env.example` ships both of those set to `true` for host mode, so
      # `make setup && docker compose up` hit it out of the box. Availability is
      # decided by whether the api can *create* a sandbox and never asks whether
      # the terminal can *attach* to one, so the two must be kept consistent
      # here. Pinned, so a host-mode value in `.env` cannot leak in and make the
      # catalog advertise a lab this stack cannot actually run.
      #
      # Ansible and CI-CD are listed for the same reason: both default to `true`
      # in code, so leaving them out switched them silently on.
      #
      # Run the services on your host (`npm run dev:api` and friends) for these
      # tracks — see README → Running the Linux track locally.
      LINUX_PROVIDER_ENABLED: "false"
      LINUX_SANDBOX_IMAGE: ${LINUX_SANDBOX_IMAGE:-jumptotech/lab-linux:latest}
      TERRAFORM_PROVIDER_ENABLED: "false"
      ANSIBLE_PROVIDER_ENABLED: "false"
      CICD_PROVIDER_ENABLED: "false"
      # Sandbox shape for container-backed sessions. These are the ceilings a
      # student's environment is created with, not suggestions.
      SANDBOX_CPUS: ${SANDBOX_CPUS:-0.5}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-512m}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-128}
      SANDBOX_USER: ${SANDBOX_USER:-student}
      SANDBOX_HOME: ${SANDBOX_HOME:-/home/student}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-none}
      # --- persistent progress (PLATFORM-005) ---
      # The api is the only service given a database credential.
      DATABASE_URL: postgresql://${POSTGRES_USER:-jumptotech}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-jumptotech_labs}
      # Forward-only migrations, applied at startup. Never destructive: it runs
      # the migration files this database has not seen and nothing else. Set to
      # false if you would rather run `npm run db:migrate` from a pipeline.
      DATABASE_AUTO_MIGRATE: ${DATABASE_AUTO_MIGRATE:-true}
      # The development identity every request is attributed to. NOT a login.
      DEV_STUDENT_ID: ${DEV_STUDENT_ID:-dev-student-001}
      # Off by design. Switching it on lets any caller name any student with a
      # header, which is only acceptable on a laptop — see README → Security.
      DEV_STUDENT_HEADER_ENABLED: ${DEV_STUDENT_HEADER_ENABLED:-false}
      # --- Docker track (PLATFORM-DOCKER) ---
      #
      # PINNED off here, because this file mounts no Docker socket anywhere and
      # names no broker. The runtime overlay switches it on and points it at
      # `sandboxd`, which is the only process that ever holds a Docker socket.
      DOCKER_TRACK_ENABLED: "false"
      DOCKER_SANDBOX_IMAGE: ${DOCKER_SANDBOX_IMAGE:-docker:27-dind}
      DOCKER_SANDBOX_MEMORY: ${DOCKER_SANDBOX_MEMORY:-2g}
      DOCKER_SANDBOX_CPUS: ${DOCKER_SANDBOX_CPUS:-2}
      DOCKER_SANDBOX_PIDS_LIMIT: ${DOCKER_SANDBOX_PIDS_LIMIT:-512}
      DOCKER_SANDBOX_MAX_CONTAINERS: ${DOCKER_SANDBOX_MAX_CONTAINERS:-10}
      DOCKER_SANDBOX_NETWORK: ${DOCKER_SANDBOX_NETWORK:-jumptotech-sandboxes}
      DOCKER_SANDBOX_DAEMON_PORT: ${DOCKER_SANDBOX_DAEMON_PORT:-2376}
      DOCKER_SANDBOX_READY_TIMEOUT_SECONDS: ${DOCKER_SANDBOX_READY_TIMEOUT_SECONDS:-180}
      DOCKER_SANDBOX_RESTART_ATTEMPTS: ${DOCKER_SANDBOX_RESTART_ATTEMPTS:-5}
      DOCKER_SANDBOX_REGISTRY_MIRROR: ${DOCKER_SANDBOX_REGISTRY_MIRROR:-}
    ports:
      # Operator-only: students reach the API through the web proxy on :3000.
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - <<: *kubeconfig
      # Lab definitions are data, mounted read-only so a running service can
      # never rewrite them.
      - type: bind
        source: ./labs
        target: /app/labs
        read_only: true
      # NOTE: no Docker socket. It used to be mounted here, and moving it out is
      # the central change of the runtime architecture — see the header. This
      # service is reachable from a browser through the web proxy, and a socket
      # mounted into it is root on the runtime host one HTTP bug away from the
      # public internet. Per-session sandboxes are created through `sandboxd`
      # instead (docker-compose.runtime.yml), which is internal-only and offers
      # eleven verbs rather than a daemon.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # NOT `sandboxes`: the API reaches a session's daemon with `docker exec`
      # on the host daemon, so it never needs network access to a sandbox and
      # never holds a session's TLS key.
      - default
      - kind

  terminal:
    build:
      context: .
      dockerfile: infrastructure/docker/terminal.Dockerfile
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Student shells create files; give them a bounded, non-persistent HOME.
    tmpfs:
      # Student shells write here. Larger than the Kubernetes-only stack needed:
      # a Docker student's build context lives under TERMINAL_WORKSPACE_ROOT.
      - /home/student:size=256m,mode=0700,uid=1001,gid=1001
      - /tmp:size=64m,mode=1777
      # Per-session kubeconfigs and Docker client certificates (0600) live here
      # and vanish with the container.
      - /run/jumptotech:size=8m,mode=0700,uid=1001,gid=1001
    pids_limit: 256
    mem_limit: 512m
    environment:
      NODE_ENV: production
      TERMINAL_PORT: 4001
      # NOTE: no KUBECONFIG, and no DOCKER_HOST. This service holds no ambient
      # credential for either substrate; each PTY gets a namespace-scoped
      # kubeconfig, or a sandbox-scoped Docker client certificate, fetched per
      # session from the API and deleted when the shell ends.
      API_INTERNAL_URL: http://api:4000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-${TERMINAL_SESSION_SECRET}}
      TERMINAL_CREDENTIALS_DIR: /run/jumptotech
      TERMINAL_WORKDIR: /home/student
      TERMINAL_WORKSPACE_ROOT: ${TERMINAL_WORKSPACE_ROOT:-/home/student/workspaces}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TERMINAL_SESSION_SECRET: ${TERMINAL_SESSION_SECRET:?set TERMINAL_SESSION_SECRET in .env (copy from .env.example)}
      TERMINAL_MAX_SESSIONS: ${TERMINAL_MAX_SESSIONS:-16}
      TERMINAL_IDLE_TIMEOUT_SECONDS: ${TERMINAL_IDLE_TIMEOUT_SECONDS:-1800}
      TERMINAL_MAX_SESSION_SECONDS: ${TERMINAL_MAX_SESSION_SECONDS:-7200}
      # A container-backed session's shell is a PTY inside that session's own
      # sandbox container. This service cannot open one here: it is given no
      # container runtime, and the Docker socket is never mounted into it.
      #
      # PINNED, not defaulted. `.env.example` ships this `true` for host mode,
      # and that value reaching this container turned a clear refusal into the
      # student seeing a raw "Cannot connect to the Docker daemon at
      # unix:///var/run/docker.sock". Switching it on here cannot make the
      # attach work — only mounting the socket into this container could, and
      # that is the one thing this file must never do.
      TERMINAL_CONTAINER_EXEC_ENABLED: "false"
    ports:
      # Operator-only: students reach the terminal WebSocket through the web proxy.
      - "127.0.0.1:${TERMINAL_PORT:-4001}:4001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - kind
      # Joined so a student's `docker` client can reach its own sandbox at
      # tcp://lab-<hash>:2376. Reachability is deliberately NOT the security
      # boundary: every sandbox mints its own CA at startup, so reaching another
      # session's address fails TLS verification in both directions.
      - sandboxes

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      # The only port students need. Point Cloudflare Tunnel here.
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      terminal:
        condition: service_started
    networks:
      - default

volumes:
  # Student history. `docker compose down` keeps it; only `down -v` removes it.
  #
  # Named from the project so a second stack gets its own volume rather than
  # sharing — and so `down -v` in one worktree cannot destroy another's database.
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-jumptotech-labs}-postgres-data

networks:
  default:
    # Per project, for the same reason as the volume: two stacks on one daemon
    # must not share a bridge, and neither may remove the other's.
    name: ${COMPOSE_PROJECT_NAME:-jumptotech-labs}
  # Created by `kind`. `npm run cluster:up` must run first.
  kind:
    external: true
    name: kind
  # The bridge per-session Docker sandboxes join. Declared here so it is created
  # and torn down with the stack; the orchestrator also creates it idempotently,
  # so a deployment that runs the API outside Compose still works.
  sandboxes:
    name: ${DOCKER_SANDBOX_NETWORK:-jumptotech-sandboxes}
