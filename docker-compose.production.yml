# ---------------------------------------------------------------------------
# JumpToTech Labs — the production exposure overlay (BETA-P0-012, BETA-P0-017).
#
#   docker compose -f docker-compose.yml -f docker-compose.runtime.yml \
#                  -f docker-compose.production.yml up -d
#
# The base and runtime files are the development stack. Every port they publish
# is bound to 127.0.0.1, which is right on a laptop and not enough on a host
# that has a public interface. This overlay is the deployment boundary:
#
#   Internet ──443──► web (nginx, TLS)  ─┬─► api       :4000  ─► postgres :5432
#            ──80───► redirect to https  └─► terminal  :4001
#                     + ACME challenge        api, terminal ─► sandboxd :4002
#
#   published    443 → web:8443   HTTPS; the only port that serves the application
#                 80 → web:8080   a redirect to https, and ACME HTTP-01 challenge
#                                 tokens; nothing else
#   published    nothing else, on any interface — not 3000, 4000, 4001, 4002,
#                5432, 9400, 9401 or 9402
#
# Every other port is reachable only across the compose networks, by the
# services that need it. Docker `EXPOSE` lines in the images are metadata and
# publish nothing; the contract is about `ports:`.
#
# The TLS edge fails closed (BETA-P0-017). The web image's certificate gate runs
# before nginx starts, and the container exits instead of serving when:
#   · PUBLIC_ORIGIN is not an https:// origin with a DNS host name;
#   · infrastructure/docker/nginx/tls/{fullchain,privkey}.pem are missing, or
#     their key is readable by group or others;
#   · the certificate is expired or not yet valid, does not name that host, is
#     not followed by its intermediates, or does not match the key.
# The health check then confirms that the certificate being served is the one
# installed on disk and has not expired. See docs/runbooks/production-tls.md.
#
# What this file does NOT provide, and what it does not claim:
#
#   · a certificate. Issuance is operator-run: an ACME client using the webroot
#     mounted below, or a certificate from any CA. scripts/tls-install.sh
#     installs one and reloads nginx. Which CA and which client are
#     DECISION REQUIRED (docs/runtime-architecture.md §12);
#   · a DNS record. PUBLIC_ORIGIN's host must resolve to this machine;
#   · a firewall, security group or private subnet. Compose cannot express
#     them, and nothing here assumes any exist;
#   · a split runtime host. sandboxd stays on this host's private bridge, as
#     declared in docker-compose.runtime.yml (BETA-P0-011);
#   · failover. One host, one instance of each service. `restart` below brings a
#     service back where it stands; it does not move it anywhere.
#
# ## Unattended restart
#
# `restart: unless-stopped` on every production service. The development stack
# deliberately has none — a container that died on a laptop should stay dead,
# where it is looked at — but on a host nobody is watching, a crashed api, a
# terminal that ran out of memory, or a reboot would otherwise leave the
# platform down until an operator noticed. Compose restarts nothing on its own.
#
# `unless-stopped`, never `always`: a service the operator stopped on purpose
# stays stopped, including across a daemon restart. The private-beta runbook's
# only way to take the site down is `prod stop web` (§3), and `always` would
# quietly undo it at the next reboot.
#
# This restores a service where it stands. It is not a supervisor: a service
# that starts, fails its gate and exits will restart in a loop, which is what
# the health check and the alerts are for. The web tier's certificate gate is
# the expected case — it fails closed until a certificate is installed, and then
# comes back by itself rather than waiting for a hand.
#
# Enforced from `docker compose config` by scripts/check-secret-distribution.mjs
# (`make secrets-check`, CI `gates`) and from the text of this file by
# services/observability/test/compose-secret-distribution.test.ts and
# tls-edge-contract.test.ts. See docs/runtime-architecture.md §11 and §12.
#
# ## Log rotation
#
# Docker's default json-file driver keeps a container's output forever, in one
# file per container under the data root. On a host that runs for a whole beta,
# the api's request log, nginx's access log and every restart's output would
# grow until the disk alarm fired, and past it. Each production service keeps at
# most five 20 MB files (100 MB). `docker compose logs` and `docker logs` read
# them as before. Sandboxes are not compose services: they get the daemon's
# default, which the preflight reports (docs/development/production-host-readiness.md §5).
# ---------------------------------------------------------------------------

x-rotated-logs: &rotated-logs
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  postgres:
    restart: unless-stopped
    logging: *rotated-logs
    # The development loopback port goes. The api reaches `postgres:5432` on
    # the internal `database` network; nothing on the host needs to.
    ports: !reset []

  api:
    restart: unless-stopped
    logging: *rotated-logs
    environment:
      # Pinned, so every production gate — owner, secrets, broker transport and
      # database transport — runs. `.env` cannot turn them back off.
      NODE_ENV: production
      AUTH_MODE: oidc
      # Required here, not defaulted to empty as in the base file: the edge's
      # certificate must name this origin's host, and compose refuses to start
      # either service without it.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN to the https origin students use - docs/runbooks/production-tls.md}
    # Operator access to :4000 is a `docker compose exec`, not a port.
    ports: !reset []

  terminal:
    restart: unless-stopped
    logging: *rotated-logs
    ports: !reset []

  web:
    restart: unless-stopped
    logging: *rotated-logs
    environment:
      # Pinned: the certificate gate runs, and a failure stops the container.
      WEB_TLS: required
      # Not a secret. The gate derives the one host name this edge serves from it.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN to the https origin students use - docs/runbooks/production-tls.md}
    # Replaces the development `127.0.0.1:3000` entry rather than adding to it.
    ports: !override
      - "443:8443"
      - "80:8080"
    volumes:
      - type: bind
        source: ./infrastructure/docker/nginx/web-tls.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      # The certificate and its private key. Mounted into this service only —
      # infrastructure/secret-distribution.json → credentialMounts. A directory,
      # not two file mounts, so scripts/tls-install.sh's rename of a renewed
      # certificate is visible inside the container.
      - type: bind
        source: ./infrastructure/docker/nginx/tls
        target: /etc/nginx/tls
        read_only: true
      # ACME HTTP-01 challenge tokens, served on port 80 only. Not secret.
      - type: bind
        source: ./infrastructure/docker/nginx/acme-webroot
        target: /var/www/acme
        read_only: true
    healthcheck:
      # The certificate being served is the installed one, and is in date.
      test: ["CMD", "jtt-tls-preflight", "served"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s

  # The broker holds the only Docker socket, and every container-track shell
  # goes through it. It has no other stanza here: its ports are reset in
  # docker-compose.production-observability.yml, where the observability overlay
  # published them.
  sandboxd:
    restart: unless-stopped
    logging: *rotated-logs

networks:
  # No route off the host for PostgreSQL, and no published port can reach it.
  database:
    internal: true
