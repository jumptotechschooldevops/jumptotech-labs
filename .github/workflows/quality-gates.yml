# The repository's quality gates, run on every push and pull request.
#
# There was no workflow running the test suite at all — only CodeQL — so a change
# could reach main having been checked on one developer's laptop and nowhere
# else. This runs what a developer runs.
#
# ## Two stages, and why
#
# `gates` is hermetic: no daemon, no cluster, no database. It is the fan-out
# point — every runtime job below `needs:` it, so a branch that does not
# typecheck never spends seven runners' worth of image builds proving it.
#
# The runtime jobs are what PLATFORM-007b left open. The integration and E2E
# suites are gated behind RUN_INTEGRATION_TESTS / RUN_DOCKER_INTEGRATION_TESTS /
# RUN_DB_TESTS so that `npm test` stays hermetic (test-support/README.md), and
# for a long time that meant they ran on developer laptops and nowhere else —
# the one place they cannot be trusted, because a laptop's daemon, cluster and
# leftover containers are shared with six other worktrees.
#
# Each runtime job gets a *fresh runner*, which is the isolation the laptop
# could never offer: its own daemon, its own cluster, its own image store,
# thrown away afterwards. That is why they are separate jobs rather than steps —
# not for parallelism, but so that no two of them can see each other's
# containers, networks, volumes or namespaces.
#
# ## Rules every runtime job here follows
#
#   · Node 22, the supported baseline (.nvmrc, README → Requirements).
#   · An explicit `timeout-minutes`, so a hung daemon fails rather than burns.
#   · A run-scoped `RUNTIME_OWNER_ID` and `JTT_TEST_RUN_ID`, so every object it
#     creates is named after it and every cleanup filters on that name — the
#     same ownership contract as docs/runtime-ownership.md.
#   · Deterministic teardown in an `if: always()` step, and diagnostics captured
#     *before* it.
#   · Suites run through `test-support/strict-vitest.ts`, not bare `vitest run`:
#     an integration suite skips itself when its infrastructure is missing, and
#     in a job that exists to provide that infrastructure a skip is a failure,
#     not a green tick. Same arguments; it also fails a run where no test ran.
#   · No secrets, no cloud credentials, no registry logins. The AWS track is
#     simulated and needs none; nothing here has any.
#
# ## What holds the Docker socket
#
# One job — `sandboxd-integration` — mounts `/var/run/docker.sock` into a test
# image, because the suite under test *is* the broker that holds it: proving
# sandboxd's refusals against a real daemon is the entire point, and a fake
# daemon proves nothing. It is mounted into the throwaway test image, never
# into a lab sandbox and never into a service that faces a student.
#
# `browser-e2e` runs the composed stack, so its `sandboxd` service holds the
# socket exactly as docker-compose.runtime.yml gives it in every deployment —
# the same single holder, not a second one. No other job mounts it.
#
# NET_RAW is not something a runner grants. It reaches a container only through
# the provider's capability gate (linux provider + `network: link` + an explicit
# `sandbox_capabilities: [NET_RAW]` in the lab), and `networking-integration`
# runs the suite that proves exactly that closed set — including that the Docker
# provider can never obtain it.

name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes the run in flight. A push to main
# never does: each merge commit is grouped by its own SHA and validated to the
# end, so every commit on main has a complete run to point to. (Grouped by ref,
# a second merge cancelled the first one's run — and a queued run is replaced by
# the next one — leaving commits on main that no finished run ever checked.)
concurrency:
  group: quality-gates-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Each job is its own runtime owner, so nothing it creates could ever be
      # confused with another job's resources. See docs/runtime-ownership.md.
      RUNTIME_OWNER_ID: ci-${{ github.run_id }}-${{ github.job }}
      JTT_TEST_RUN_ID: ci${{ github.run_id }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes. Not leaving the token in .git/config keeps it
          # away from every later step, `npm ci`'s dependency scripts included.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # One place decides the version, and it is the same file `nvm use`
          # reads on a laptop. A literal here is a second source of truth that
          # drifts silently.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Static and a few seconds long: every lab.yaml, its setup assets, its
      # prerequisites and every learning path, read the way the API and the
      # providers read them. `npm test` asserts the same thing, but this step
      # fails first and prints one line per defect instead of a test diff.
      # Warnings are printed and never fail the build. See
      # docs/development/catalog-quality-audit.md.
      - name: Lab catalog validation
        run: npm run validate:labs

      # No Docker daemon is needed: the host-execution guard makes any attempt to
      # start one a hard failure rather than a silent dependency, so a suite that
      # regains one fails here instead of on someone's laptop months later.
      - name: Test
        run: npm test

      - name: Production composition wiring
        run: |
          npm run test:composition
          grep -q 'buildSandboxComposition' apps/api/src/index.ts
          grep -q 'buildRequirementWaiter' apps/api/src/composition.ts

      # --- PLATFORM-003 -----------------------------------------------------
      #
      # Scoped deliberately to what proves the observability story, and no
      # further: this is not a general CI redesign, and the integration and DB
      # suites stay gated exactly as they were.
      #
      # `npm test` above already covers the metric contracts, the redaction
      # corpus, the label policy, dashboard/alert validity and the health
      # semantics. What it cannot cover is whether the rule files are valid to
      # the *programs that consume them*, which is what promtool and amtool are
      # for. The GitHub runner has a Docker daemon, so both run from their
      # official images and no tool has to be installed.
      #
      # One script rather than inline steps, so `make observability-check` on a
      # laptop and CI run exactly the same checks — a CI-only validation is one
      # that gets discovered in a pull request rather than before it.
      - name: Observability configuration (promtool, amtool, dashboards)
        run: bash scripts/check-observability.sh

      # A grep, not a test, because it is asserting the *absence* of something
      # from a compose file rather than a property of running code. Mounting the
      # Docker socket into a monitoring container would reintroduce the exact
      # root-equivalent capability the runtime broker exists to remove.
      - name: Observability containers hold no container runtime
        run: |
          for file in docker-compose.observability.yml docker-compose.production-observability.yml; do
            if grep -q 'docker.sock' "$file"; then
              echo "$file mounts a Docker socket" >&2
              exit 1
            fi
          done
          for net in sandboxes kind; do
            if awk '/^  (prometheus|grafana|alertmanager):/,/^  [a-z]/' \
                 docker-compose.observability.yml | grep -q "$net"; then
              echo "an observability container joins the $net network" >&2
              exit 1
            fi
          done

      # `docker-compose.runtime.yml` says of its one socket mount: "this is the
      # only mount of it in the whole stack, and this is the only service that
      # gets one." That was a comment, which is to say it was true until someone
      # added a second one. This is the same claim as a gate.
      #
      # A grep for the same reason the observability one above is a grep: it
      # asserts the *absence* of a mount from a file, which no running code can
      # observe. Handing the socket to the api, the terminal or the web tier
      # would give a student-facing process the root-equivalent capability that
      # the whole broker architecture exists to keep away from them.
      - name: sandboxd is the only service holding a Docker socket
        run: |
          set -euo pipefail
          for file in docker-compose.yml docker-compose.runtime.yml \
                      docker-compose.observability.yml docker-compose.production.yml \
                      docker-compose.production-observability.yml; do
            # Comments are skipped deliberately: `docker-compose.yml` discusses
            # the socket at length under both `api` and `terminal`, explaining
            # why neither may have one. Prose about a mount is not a mount.
            owner=$(awk '
              /^[[:space:]]*#/ { next }
              /^  [a-z][a-z0-9_-]*:/ { service = $1; sub(/:$/, "", service) }
              /\/var\/run\/docker\.sock/ { print service }
            ' "$file" | sort -u)
            for service in $owner; do
              if [ "$service" != "sandboxd" ]; then
                echo "$file mounts the Docker socket into '$service'" >&2
                exit 1
              fi
            done
          done
          echo "only sandboxd mounts /var/run/docker.sock"

      # BETA-P0-010. `npm test` already reads the compose files as text against
      # infrastructure/secret-distribution.json; this asks `docker compose config`
      # instead, so overlays, merges and interpolation are resolved the way the
      # running stack resolves them. Sentinel values only, from a temporary env
      # file and a scrubbed environment; it prints variable and service names.
      #
      # BETA-P0-011 extends the same resolved definitions to published ports
      # (4002 never; 4000/4001/9400-9402 loopback only) and credential mounts,
      # the Docker socket among them.
      #
      # BETA-P0-012: every development publication on 127.0.0.1 (3000 and 5432
      # included); the production stack publishing exactly 443→web:8443 and
      # 80→web:8080; PostgreSQL alone with the api on an internal network.
      - name: Each service receives exactly its allowed secrets, mounts, ports and networks
        run: node scripts/check-secret-distribution.mjs

      # BETA-P0-013. The backup and restore scripts' refusals and failure paths,
      # against a fake daemon: a failed dump leaves nothing that looks like a
      # backup, retention touches only its own archives, and a restore refuses a
      # bad checksum, an unreadable archive, a connected session or a missing
      # confirmation before it changes anything. The real round trip is the
      # restore drill in `postgres-integration`.
      - name: Backup and restore scripts refuse unsafe states
        run: bash scripts/test-db-backup-restore.sh

      # Production-host readiness. The real compose files resolved with sentinel
      # environments and read by the real api/terminal/sandboxd config loaders:
      # a complete 5/1-capacity beta configuration passes, and each unsafe variation
      # (capacity default, development identity, plaintext origin, waived
      # attestation, placeholder or shared secrets, socket group) is refused.
      # Then the preflight, smoke and capacity scripts against fakes: every unsafe
      # host state is a FAIL, no secret is printed, and only read-only docker and
      # kubectl verbs are ever called. None of this is evidence about a real host.
      - name: Production configuration gates fail closed
        run: npm run --silent production:config-check -- --self-test

      - name: Production-host scripts fail closed and change nothing
        run: bash scripts/test-production-host-scripts.sh

      # The support bundle an operator sends after an incident: sentinels planted
      # in .env, logs, SQL, query strings, owner ids and terminal lines never
      # reach it; only read-only verbs run; a leak deletes it.
      - name: Support bundle holds no secret or student data
        run: bash scripts/test-private-beta-diagnostics.sh

      # An archive holds every student's data. .gitignore keeps the default names
      # out; this catches one committed under any name or path.
      - name: No database archive is committed
        run: |
          if git ls-files | grep -E '\.(dump|backup|bak)(\.sha256|\.partial)?$'; then
            echo "a database archive is tracked by git" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

  # ===========================================================================
  # RUNTIME INTEGRATION GATES
  #
  # Everything below needs infrastructure the hermetic job deliberately cannot
  # reach. Each job builds its own, on its own runner, and tears it down.
  # ===========================================================================

  # --- PostgreSQL -----------------------------------------------------------
  #
  # `make test-db` is the canonical path (README → Testing). It starts a
  # throwaway `postgres:16-alpine`, runs the three persistence suites against
  # it, and removes it whether they pass or fail — so there is no development
  # database to point at, no password to configure, and nothing to leave dirty.
  postgres-integration:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      RUNTIME_OWNER_ID: ci-${{ github.run_id }}-postgres
      JTT_TEST_RUN_ID: cipg${{ github.run_id }}
      # Named explicitly rather than left to the default, so the port this job
      # binds is a decision in this file rather than a collision to debug.
      TEST_DB_PORT: 55432

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Persistence suites against a throwaway PostgreSQL
        run: make test-db

      # BETA-P0-013. Backs up a seeded disposable server with scripts/db-backup.sh,
      # destroys it, restores into a fresh one with scripts/db-restore.sh, and
      # proves the result identical and usable by the migrator and the
      # repository. Its containers are labelled with this job's JTT_TEST_RUN_ID.
      - name: Restore drill (back up, lose the server, restore, verify)
        run: make db-restore-drill

      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a --filter name=jumptotech-labs-test-db
          docker logs --tail 200 jumptotech-labs-test-db 2>&1 || true

      # `make test-db` removes the container on both paths; this covers the
      # third, where the job was cancelled between the two.
      - name: Clean up
        if: always()
        run: |
          docker rm -f jumptotech-labs-test-db >/dev/null 2>&1 || true
          docker ps -aq --filter "label=jumptotech.io/restore-drill=${JTT_TEST_RUN_ID}" \
            | xargs -r docker rm -f >/dev/null 2>&1 || true

  # --- Kubernetes -----------------------------------------------------------
  #
  # A fresh kind cluster from the repository's own `scripts/cluster-up.sh`, not
  # from a third-party action: the script is what a developer runs, and a CI
  # cluster built some other way would prove a configuration nobody uses.
  kind-integration:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 110

    env:
      RUNTIME_OWNER_ID: ci-${{ github.run_id }}-kind
      JTT_TEST_RUN_ID: cik8s${{ github.run_id }}
      LAB_CLUSTER_NAME: jumptotech-labs
      KIND_VERSION: v0.31.0
      KUBECTL_VERSION: v1.34.2
      # linux/amd64, from the .sha256sum / .sha256 files published beside each
      # binary; change them with the versions. A download that does not match
      # fails the step instead of running as root on the runner.
      KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
      KUBECTL_SHA256: 9591f3d75e1581f3f7392e6ad119aab2f28ae7d6c6e083dc5d22469667f27253

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install kind and kubectl
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSLo /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind --version
          kubectl version --client

      - name: Install
        run: npm ci

      - name: Create the cluster
        run: npm run cluster:up

      - name: Orchestrator integration suite
        env:
          RUN_INTEGRATION_TESTS: '1'
          KUBECONFIG: infrastructure/kind/generated/kubeconfig-host.yaml
        run: |
          npx tsx test-support/strict-vitest.ts test/integration.test.ts \
            --root services/lab-orchestrator

      # BETA-P0-016: PodSecurity admission, the namespace admission policy and
      # kubelet seccompDefault, proved against the cluster cluster-up.sh built.
      - name: Pod security suite
        env:
          RUN_INTEGRATION_TESTS: '1'
          KUBECONFIG: infrastructure/kind/generated/kubeconfig-host.yaml
        run: |
          npx tsx test-support/strict-vitest.ts test/pod-security-integration.test.ts \
            --root services/lab-orchestrator

      - name: Whole-catalog Kubernetes suite
        env:
          RUN_INTEGRATION_TESTS: '1'
          KUBECONFIG: infrastructure/kind/generated/kubeconfig-host.yaml
        run: |
          npx tsx test-support/strict-vitest.ts test/labs-integration.test.ts \
            --root services/lab-orchestrator

      # BETA-P0-015. The steps above prove the NetworkPolicy objects exist; a
      # cluster accepts those whether or not anything enforces them. This proves
      # enforcement by connection attempts, each denial paired with a negative
      # control (the same connection, without the policy, succeeding), through
      # the probe, through real sessions, and through the admission gate.
      # docs/kubernetes-network-security.md §10.
      - name: NetworkPolicy enforcement, with negative controls
        env:
          RUN_INTEGRATION_TESTS: '1'
          KUBECONFIG: infrastructure/kind/generated/kubeconfig-host.yaml
        run: |
          npx tsx test-support/strict-vitest.ts test/network-policy-enforcement-integration.test.ts \
            --root services/lab-orchestrator \
            --testTimeout=900000 --hookTimeout=900000

      # The operator command production acceptance runs, run the same way here.
      # Exit 0 only on PASS; FAIL and INCONCLUSIVE fail the job.
      - name: Operator enforcement probe
        env:
          KUBECONFIG: infrastructure/kind/generated/kubeconfig-host.yaml
        run: npm run verify:network-policy -- --write-attestation --run-id "ci${{ github.run_id }}"

      - name: Diagnostics
        if: failure()
        env:
          KUBECONFIG: infrastructure/kind/generated/kubeconfig-host.yaml
        run: |
          kubectl get nodes -o wide || true
          kubectl get namespaces || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
          mkdir -p /tmp/kind-logs
          kind export logs /tmp/kind-logs --name "$LAB_CLUSTER_NAME" || true

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kind-logs-${{ github.run_id }}
          path: /tmp/kind-logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Leaked lab namespaces
        if: always()
        run: |
          KUBECONFIG=infrastructure/kind/generated/kubeconfig-host.yaml \
            kubectl get namespaces -o name | grep -E 'lab-|jtt-netprobe-' || echo "no lab namespaces left"

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name "$LAB_CLUSTER_NAME" || true

  # --- Linux / Terraform / Ansible / CI-CD sandboxes -------------------------
  #
  # One job for the four container-backed tracks that share `sandbox-build.sh`,
  # because they share the four images it builds and building them twice on two
  # runners costs more than running the suites in sequence on one.
  sandbox-integration:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RUNTIME_OWNER_ID: ci-${{ github.run_id }}-sandbox
      JTT_TEST_RUN_ID: cisbx${{ github.run_id }}
      RUN_INTEGRATION_TESTS: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # All four tags or none — the script refuses a half-configured set, and
      # on a throwaway runner the canonical `:latest` tags are the right ones.
      - name: Build the sandbox images
        run: npm run sandbox:build

      - name: Linux and Terraform sandboxes
        run: npx tsx test-support/strict-vitest.ts test/sandbox-integration.test.ts --root apps/api

      - name: Linux man pages
        run: |
          npx tsx test-support/strict-vitest.ts test/linux-man-pages-integration.test.ts \
            --root services/lab-orchestrator

      - name: Ansible runtime
        run: |
          npx tsx test-support/strict-vitest.ts test/ansible-runtime-integration.test.ts \
            --root services/lab-orchestrator

      - name: CI/CD runtime
        run: |
          npx tsx test-support/strict-vitest.ts test/cicd-runtime-integration.test.ts \
            --root services/lab-orchestrator

      # BETA-P0-019. Every absolute path the providers exec, present in each of
      # the four images just built. It found `/usr/bin/stat` missing from the
      # Alpine images, which no fake runtime can, and until now ran nowhere.
      - name: Sandbox images carry every binary the providers exec
        run: |
          npx tsx test-support/strict-vitest.ts test/sandbox-image-binaries-integration.test.ts \
            --root services/lab-orchestrator

      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a
          docker network ls
          docker volume ls

      - name: Leaked sandboxes
        if: always()
        run: |
          docker ps -aq --filter label=jumptotech.io/managed=true \
            | xargs -r docker inspect -f '{{.Name}} {{.Config.Image}}' || true

      - name: Clean up
        if: always()
        run: |
          docker ps -aq --filter label=jumptotech.io/managed=true | xargs -r docker rm -f || true
          docker network ls -q --filter name=jtt-net- | xargs -r docker network rm || true

  # --- Networking (NET-004 … NET-008 and the NET_RAW boundary) --------------
  #
  # Its own job rather than a step in `sandbox-integration`, because the thing
  # it proves is an isolation boundary and the evidence should not be entangled
  # with anything else's containers. These suites create per-session `--internal`
  # networks, peer containers, and — for exactly two labs — a container holding
  # CAP_NET_RAW. `net-raw-capability-integration` is the suite that proves the
  # grant is a closed set: linux provider only, `network: link` only, declared
  # in the lab only, and unobtainable by the Docker provider.
  networking-integration:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RUNTIME_OWNER_ID: ci-${{ github.run_id }}-net
      JTT_TEST_RUN_ID: cinet${{ github.run_id }}
      RUN_INTEGRATION_TESTS: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # NET-004/005/006 read a prebuilt tag; NET-007, NET-008 and the NET_RAW
      # suite build their own run-scoped tags and remove them afterwards.
      - name: Build the Linux sandbox image
        run: |
          docker build -t jumptotech/lab-linux:net004-e2e \
            -f infrastructure/docker/sandbox-linux.Dockerfile .

      - name: NET-004 … NET-008
        run: |
          npx tsx test-support/strict-vitest.ts \
            test/net004-integration.test.ts \
            test/net005-integration.test.ts \
            test/net006-integration.test.ts \
            test/net007-integration.test.ts \
            test/net008-integration.test.ts \
            --root services/lab-orchestrator

      - name: The NET_RAW capability boundary
        run: |
          npx tsx test-support/strict-vitest.ts test/net-raw-capability-integration.test.ts \
            --root services/lab-orchestrator

      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a
          docker network ls --filter name=jtt-net-
          docker network ls -q --filter name=jtt-net- | xargs -r docker network inspect || true

      - name: Leaked sandboxes, peers and segments
        if: always()
        run: |
          docker ps -aq --filter label=jumptotech.io/managed=true \
            | xargs -r docker inspect -f '{{.Name}} {{.Config.Image}}' || true
          docker network ls --filter name=jtt-net- --format '{{.Name}}' || true

      - name: Clean up
        if: always()
        run: |
          docker ps -aq --filter label=jumptotech.io/managed=true | xargs -r docker rm -f || true
          docker network ls -q --filter name=jtt-net- | xargs -r docker network rm || true

  # --- Docker track ---------------------------------------------------------
  #
  # Per-session Docker-in-Docker: every session gets its own daemon in its own
  # container, reached over mTLS with that session's client certificate. The
  # host's socket is never handed to a sandbox, and `DockerLabProvider` cannot
  # obtain NET_RAW — both are properties these suites assert rather than assume.
  docker-integration:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      RUNTIME_OWNER_ID: ci-${{ github.run_id }}-docker
      JTT_TEST_RUN_ID: cidkr${{ github.run_id }}
      RUN_DOCKER_INTEGRATION_TESTS: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Pulled once here rather than inside the first suite's ready-timeout, so
      # a slow registry reads as a slow pull instead of a daemon that failed to
      # start. The tag is the provider's own default.
      - name: Pre-pull the sandbox daemon image
        run: docker pull docker:27-dind

      - name: Core Docker suite
        run: |
          npx tsx test-support/strict-vitest.ts test/docker-integration.test.ts \
            --root services/lab-orchestrator \
            --testTimeout=900000 --hookTimeout=900000

      # Sequential, not one vitest invocation: each of these starts its own
      # privileged dind sandbox, and six at once on a two-core runner turns a
      # daemon-startup timeout into the thing being measured.
      - name: Per-lab Docker suites (009 … 014)
        run: |
          set -euo pipefail
          for suite in docker009 docker010 docker011 docker012 docker013 docker014; do
            echo "::group::$suite"
            npx tsx test-support/strict-vitest.ts "test/${suite}-integration.test.ts" \
              --root services/lab-orchestrator \
              --testTimeout=900000 --hookTimeout=900000
            echo "::endgroup::"
          done

      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a
          docker volume ls
          docker network ls

      - name: Leaked sandboxes and volumes
        if: always()
        run: |
          docker ps -aq --filter label=jumptotech.io/managed=true \
            | xargs -r docker inspect -f '{{.Name}} {{.Config.Image}}' || true
          docker volume ls --filter label=jumptotech.io/managed=true --format '{{.Name}}' || true

      - name: Clean up
        if: always()
        run: |
          docker ps -aq --filter label=jumptotech.io/managed=true | xargs -r docker rm -f || true
          docker volume ls -q --filter label=jumptotech.io/managed=true | xargs -r docker volume rm -f || true

  # --- Terminal (real PTY) --------------------------------------------------
  #
  # `make test-terminal-container` runs the suite *inside* the terminal test
  # image, not on the runner: `node-pty` is a native addon, the suite skips
  # itself where it cannot spawn a PTY, and a skipped suite in CI is a gate that
  # silently stopped gating. The container also joins the `kind` network, which
  # is how the deployed terminal container reaches the API server.
  terminal-integration:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      RUNTIME_OWNER_ID: ci-${{ github.run_id }}-terminal
      JTT_TEST_RUN_ID: citty${{ github.run_id }}
      LAB_CLUSTER_NAME: jumptotech-labs
      KIND_VERSION: v0.31.0
      KUBECTL_VERSION: v1.34.2
      # linux/amd64, from the .sha256sum / .sha256 files published beside each
      # binary; change them with the versions. A download that does not match
      # fails the step instead of running as root on the runner.
      KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
      KUBECTL_SHA256: 9591f3d75e1581f3f7392e6ad119aab2f28ae7d6c6e083dc5d22469667f27253

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install kind and kubectl
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSLo /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Install
        run: npm ci

      - name: Create the cluster
        run: npm run cluster:up

      - name: Terminal suite, in a container, against a real PTY
        run: make test-terminal-container

      - name: Diagnostics
        if: failure()
        env:
          KUBECONFIG: infrastructure/kind/generated/kubeconfig-host.yaml
        run: |
          kubectl get namespaces || true
          kubectl get serviceaccounts -A || true
          docker ps -a

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name "$LAB_CLUSTER_NAME" || true

  # --- sandboxd (the runtime broker) ----------------------------------------
  #
  # The one job that mounts the Docker socket, and the reason is the subject:
  # `sandboxd` is the only process in the architecture that legitimately holds
  # one, and the refusals it exists to enforce — a caller that cannot name a
  # container, a session that cannot reach another session's sandbox — are only
  # worth anything against a real daemon. The host suite short-circuits where it
  # cannot spawn a PTY, so the make target runs it in the test image instead.
  sandboxd-integration:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      RUNTIME_OWNER_ID: ci-${{ github.run_id }}-sandboxd
      JTT_TEST_RUN_ID: cisbd${{ github.run_id }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Broker suite, against a real daemon and real PTYs
        run: make test-sandboxd-container

      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a
          docker network ls

      - name: Leaked sandboxes
        if: always()
        run: |
          docker ps -aq --filter label=jumptotech.io/managed=true \
            | xargs -r docker inspect -f '{{.Name}} {{.Config.Image}}' || true

      - name: Clean up
        if: always()
        run: docker ps -aq --filter label=jumptotech.io/managed=true | xargs -r docker rm -f || true

  # --- Public TLS edge (BETA-P0-017) ------------------------------------------
  #
  # The web image's `edge` stage, configured from `docker compose config` for
  # the production stack, against real TLS clients. The certificates are
  # TEST-ONLY: minted in memory for labs.jtt.test (a reserved .test name) by
  # test-support/tls-pki.ts. The job contacts no CA and issues nothing. It
  # proves the certificate gate's refusals, TLS versions and suites (with
  # negative controls), the redirect and ACME route, the terminal WebSocket
  # through TLS, and renewal through scripts/tls-install.sh.
  tls-edge-integration:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RUNTIME_OWNER_ID: ci-${{ github.run_id }}-tls
      JTT_TEST_RUN_ID: citls${{ github.run_id }}
      RUN_INTEGRATION_TESTS: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: TLS edge suite, in the real web image
        run: |
          npx tsx test-support/strict-vitest.ts test/tls-edge-integration.test.ts \
            --root services/observability \
            --testTimeout=300000 --hookTimeout=900000

      # The edge's own logs are safe to print: the suite asserts they never
      # contain key material, refusals included.
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a --filter label=jumptotech.io/tls-edge-test
          for c in $(docker ps -aq --filter label=jumptotech.io/tls-edge-test); do
            docker logs --tail 50 "$c" 2>&1 || true
          done

      - name: Clean up
        if: always()
        run: |
          docker ps -aq --filter label=jumptotech.io/tls-edge-test | xargs -r docker rm -f || true
          docker network ls -q --filter label=jumptotech.io/tls-edge-test | xargs -r docker network rm || true

  # --- Real-browser E2E (Playwright) -----------------------------------------
  #
  # The only job that drives the product through a real browser. It starts the
  # composed stack — base + runtime overlay + e2e/docker-compose.e2e.yml — with
  # the api in OIDC mode against a loopback test identity provider, then runs
  # Chromium through sign-in, a learning path, a LINUX-001 session in a real
  # sandbox container, the browser terminal, Verify, progress, End lab, and a
  # second student's isolation. See docs/development/browser-e2e-private-beta.md.
  #
  # Not proven here: the production overlay, TLS, a real identity provider, the
  # Kubernetes/Docker/Terraform/Ansible/CI-CD tracks, and any real host.
  #
  # Every secret is generated per run by e2e/stack.sh with openssl; none comes
  # from repository or organisation secrets, and none is printed.
  browser-e2e:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Run-scoped, like every runtime job: it is the compose project and the
      # RUNTIME_OWNER_ID every sandbox and cleanup filters on.
      E2E_PROJECT: jtt-e2e-${{ github.run_id }}
      CI: 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start the stack and wait until it is usable
        run: bash e2e/stack.sh up

      - name: Browser E2E suite
        run: |
          E2E_BASE_URL=http://127.0.0.1:33700 \
          E2E_API_URL=http://127.0.0.1:34700 \
          E2E_RUNTIME_OWNER_ID="$E2E_PROJECT" \
            npx playwright test --config e2e/playwright.config.ts

      - name: Diagnostics
        if: failure()
        run: |
          bash e2e/stack.sh status || true
          bash e2e/stack.sh logs || true
          docker ps -a --filter label=jumptotech.io/managed=true || true

      # Traces, screenshots and videos of test-only students on a throwaway stack.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Tear down
        if: always()
        run: bash e2e/stack.sh down
